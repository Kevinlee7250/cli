name: 🔎 AdSense 승인 감사·보완

on:
  # 매주 수요일 오전 8시 KST (UTC 화요일 23:00) — 전체 블로그 자동 감사·보완
  # (월요일 09시 weekly-brief, auto-repair 02시와 겹치지 않도록 분산)
  schedule:
    - cron: '0 23 * * 2'

  workflow_dispatch:
    inputs:
      blog_id:
        description: '블로그 ID (blog1/blog2/blog3/all)'
        required: false
        default: 'blog1'
      dry_run:
        description: '검사만 (실제 수정 없음)'
        type: boolean
        required: false
        default: false
      draft_short:
        description: '2500자 미만 글을 draft로 전환 (AdSense 최소 콘텐츠 요건 대응)'
        type: boolean
        required: false
        default: false
      create_pages:
        description: '없는 필수 페이지(개인정보·소개·면책 조항) 생성 — 있는 페이지는 건드리지 않음'
        type: boolean
        required: false
        default: false
      enrich:
        description: 'FAQ·참고자료 보강 (off/both/faq) — 출처는 research_collector가 찾은 실존 URL만'
        required: false
        default: 'off'
        type: choice
        options:
          - 'off'
          - both
          - faq
      enrich_limit:
        description: '보강할 최대 편수 (0=전체). 나눠 돌리는 것을 권장'
        required: false
        default: '10'
      apply_expansion:
        description: '사람이 쓴 보강 원고(expansions/*.json)를 발행 글에 반영'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: adsense-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5
        with:
          ref: latest

      - name: Python 3.11 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          IMGBB_API_KEY="${{ secrets.IMGBB_API_KEY }}"
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          LOG_LEVEL=info
          ENVEOF

      - name: AdSense 감사·보완 실행
        working-directory: blog-automation
        run: |
          mkdir -p logs
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 주간 자동 실행은 블로그 전체를 감사·자동보완 (수동 실행 없이도 최신 상태 유지)
            ARGS="--blog all"
          else
            ARGS="--blog ${{ inputs.blog_id || 'blog1' }}"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
              echo "=== 검사 전용 모드 (수정 없음) ==="
            fi
            if [ "${{ inputs.draft_short }}" = "true" ]; then
              ARGS="$ARGS --draft-short"
              echo "=== 글자수 미달 글 draft 전환 활성화 ==="
            fi
          fi
          echo "실행 인자: $ARGS"
          python adsense_audit.py $ARGS

      # 없는 페이지만 만듭니다. 이미 있는 페이지는 손대지 않습니다 — 사람이
      # 고쳐 둔 내용을 자동 생성본으로 덮어쓰는 것은 되돌리기 어렵습니다.
      # 기본값은 꺼져 있고, 사람이 켤 때만 돕니다.
      - name: 필수 페이지 생성 (없는 것만)
        if: inputs.create_pages == true
        working-directory: blog-automation
        run: |
          ARGS=""
          [ "${{ inputs.blog_id }}" != "all" ] && ARGS="--blog ${{ inputs.blog_id }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python page_creator.py $ARGS || echo "⚠️ 페이지 생성 실패"

      # FAQ·참고자료 보강. 출처는 research_collector가 찾은 실존 URL만 쓰고,
      # 자료를 못 찾으면 그 글은 건너뜁니다 — 가짜 URL은 클릭하면 바로
      # 들통나므로 안 넣느니만 못합니다. FAQ 답변은 본문에 없는 수치가
      # 들어가면 그 항목을 버립니다(2026-09-19 추가한 검증).
      - name: FAQ·참고자료 보강
        if: inputs.enrich != 'off' && inputs.enrich != ''
        working-directory: blog-automation
        run: |
          ARGS="--blog ${{ inputs.blog_id || 'blog1' }} --limit ${{ inputs.enrich_limit || '10' }}"
          [ "${{ inputs.enrich }}" = "faq" ] && ARGS="$ARGS --faq-only"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
            echo "=== 보강 계획만 확인 (수정 없음) ==="
          fi
          echo "실행 인자: $ARGS"
          python enrich_posts.py $ARGS || echo "⚠️ 보강 실패 — docs/data/enrich_report.json 확인"

      # 분량이 모자란 글을 AI로 자동 증량하는 기능은 일부러 없습니다.
      # "글자수를 채워라"만큼 지어내기를 부르는 지시도 없고, 그게 거절
      # 사유였습니다. 이 단계는 사람이 검증해 git에 올린 원고를 옮겨
      # 붙이기만 합니다.
      - name: 보강 원고 반영
        if: inputs.apply_expansion == true
        working-directory: blog-automation
        run: |
          ARGS=""
          [ "${{ inputs.dry_run }}" = "true" ] || ARGS="--apply"
          python apply_expansion.py $ARGS || echo "⚠️ 보강 원고 반영 실패"

      # 심사 필수 페이지가 실제로 블로그에 있는지 확인합니다 (읽기 전용).
      - name: 필수 페이지 확인 (읽기 전용)
        if: always()
        working-directory: blog-automation
        run: python required_pages_check.py || echo "⚠️ 필수 페이지 확인 실패 — docs/data/required_pages.json 확인"

      - name: 감사 리포트 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in docs/data/adsense_audit.json docs/data/required_pages.json \
                   docs/data/enrich_report.json; do
            [ -f "$f" ] && git add -f "$f"
          done
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "🔎 AdSense 감사 리포트 (#${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase --autostash origin latest \
                && git push origin latest && break
              sleep $((i * 3))
            done
          fi
