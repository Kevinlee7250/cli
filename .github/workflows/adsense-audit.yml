name: 🔎 AdSense 승인 감사·보완

on:
  # 매주 수요일 오전 8시 KST (UTC 화요일 23:00) — 전체 블로그 자동 감사·보완
  # (월요일 09시 weekly-brief, auto-repair 02시와 겹치지 않도록 분산)
  schedule:
    - cron: '0 23 * * 2'

  workflow_dispatch:
    inputs:
      blog_id:
        description: '블로그 ID (blog1/blog2/blog3/all)'
        required: false
        default: 'blog1'
      dry_run:
        description: '검사만 (실제 수정 없음)'
        type: boolean
        required: false
        default: false
      draft_short:
        description: '2500자 미만 글을 draft로 전환 (AdSense 최소 콘텐츠 요건 대응)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: adsense-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          IMGBB_API_KEY="${{ secrets.IMGBB_API_KEY }}"
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          LOG_LEVEL=info
          ENVEOF

      - name: AdSense 감사·보완 실행
        working-directory: blog-automation
        run: |
          mkdir -p logs
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 주간 자동 실행은 블로그 전체를 감사·자동보완 (수동 실행 없이도 최신 상태 유지)
            ARGS="--blog all"
          else
            ARGS="--blog ${{ inputs.blog_id || 'blog1' }}"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
              echo "=== 검사 전용 모드 (수정 없음) ==="
            fi
            if [ "${{ inputs.draft_short }}" = "true" ]; then
              ARGS="$ARGS --draft-short"
              echo "=== 글자수 미달 글 draft 전환 활성화 ==="
            fi
          fi
          echo "실행 인자: $ARGS"
          python adsense_audit.py $ARGS

      - name: 감사 리포트 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f docs/data/adsense_audit.json ] && git add -f docs/data/adsense_audit.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "🔎 AdSense 감사 리포트 (#${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase --autostash origin claude/blog-automation-system-KAbtE \
                && git push origin claude/blog-automation-system-KAbtE && break
              sleep $((i * 3))
            done
          fi
