name: 🚨 운영 알림 워치독

on:
  # 6시간마다 — 실패를 하루 안에는 반드시 알아채는 간격
  schedule:
    - cron: '20 */6 * * *'

  workflow_dispatch:
    inputs:
      hours:
        description: '조회할 시간 범위 (시간)'
        required: false
        default: '12'
      dry_run:
        description: '감지만 하고 발송하지 않음'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: alert-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5
        with:
          ref: latest

      - name: Python 3.11 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: 이상 감지·알림
        working-directory: blog-automation
        env:
          # 기본 GITHUB_TOKEN으로 이 저장소의 워크플로 실행 목록을 읽습니다
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p logs
          ARGS="--hours ${{ inputs.hours || '12' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "실행 인자: $ARGS"
          python alert_notifier.py $ARGS

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # docs/.gitignore(npm/cli 템플릿)가 docs/* 를 무시하므로 -f 필요
          git add -f docs/data/alerts.json 2>/dev/null || true
          git add blog-automation/logs/alert_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "🚨 운영 알림 점검 (#${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase --autostash origin latest \
                && git push origin latest && break
              sleep $((i * 3))
            done
          fi
