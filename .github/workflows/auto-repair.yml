name: 🔧 시스템 자동 수리

on:
  # 블로그 자동화 실행 완료 후 항상 실행 (성공·실패 무관)
  workflow_run:
    workflows: ["블로그 자동화 실행"]
    types: [completed]

  # 매일 오전 2시 KST (UTC 17:00) — 야간 정기 점검
  schedule:
    - cron: '0 17 * * *'

  # 대시보드 봇에서 수동 실행
  workflow_dispatch:
    inputs:
      dry_run:
        description: '진단만 실행 (실제 수리 없음)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  auto-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          BLOGS_CONFIG=${{ secrets.BLOGS_CONFIG }}
          BLOG_NAME="${{ secrets.BLOG_NAME }}"
          ADSENSE_CLIENT_ID="${{ secrets.ADSENSE_CLIENT_ID }}"
          ADSENSE_SLOT_IDS="${{ secrets.ADSENSE_SLOT_IDS }}"
          LOG_LEVEL=info
          LOG_FILE=./logs/automation.log
          ENVEOF

      - name: 로그 디렉토리 생성
        working-directory: blog-automation
        run: mkdir -p logs

      - name: 🔧 자동 진단 및 수리 실행
        working-directory: blog-automation
        run: |
          DRY="${{ inputs.dry_run || 'false' }}"
          if [ "$DRY" = "true" ]; then
            echo "=== 진단 전용 모드 (실제 수리 없음) ==="
            python auto_repair.py --dry
          else
            echo "=== 자동 수리 모드 ==="
            python auto_repair.py
          fi

      - name: 수리 결과 커밋 & 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f \
            docs/data/repairs.json \
            blog-automation/logs/repair_history.json \
            blog-automation/logs/run_history.json \
            blog-automation/logs/used_keywords.json \
            blog-automation/logs/series.json \
            docs/data/pending_posts.json \
            2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 건너뜀"
          else
            git commit -m "🔧 자동 수리 완료 (#${{ github.run_number }})"
            git pull --rebase origin claude/blog-automation-system-KAbtE
            git push origin claude/blog-automation-system-KAbtE
          fi

      - name: 수리 로그 아티팩트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-logs-${{ github.run_number }}
          path: blog-automation/logs/auto_repair.log
          retention-days: 30
