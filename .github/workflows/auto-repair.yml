name: 🔧 시스템 자동 수리

on:
  # 블로그 자동화 실행 완료 후 항상 실행 (성공·실패 무관)
  workflow_run:
    workflows: ["블로그 자동화 실행"]
    types: [completed]
    branches: [latest]

  # 매일 오전 2시 KST (UTC 17:00) — 야간 정기 점검
  schedule:
    - cron: '0 17 * * *'

  # 대시보드 봇에서 수동 실행
  workflow_dispatch:
    inputs:
      dry_run:
        description: '진단만 실행 (실제 수리 없음)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: auto-repair
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5
        with:
          ref: latest

      - name: Python 3.11 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          BLOG_NAME="${{ secrets.BLOG_NAME }}"
          ADSENSE_CLIENT_ID="${{ secrets.ADSENSE_CLIENT_ID }}"
          ADSENSE_SLOT_IDS="${{ secrets.ADSENSE_SLOT_IDS }}"
          LOG_LEVEL=info
          LOG_FILE=./logs/automation.log
          ENVEOF

      - name: 로그 디렉토리 생성
        working-directory: blog-automation
        run: mkdir -p logs

      - name: 🔐 인증 헬스체크 (Google OAuth 자격증명 만료 감지)
        working-directory: blog-automation
        continue-on-error: true
        run: python auth_health_check.py

      - name: 🔧 자동 진단 및 수리 실행
        working-directory: blog-automation
        run: |
          DRY="${{ inputs.dry_run || 'false' }}"
          if [ "$DRY" = "true" ]; then
            echo "=== 진단 전용 모드 (실제 수리 없음) ==="
            python auto_repair.py --dry
          else
            echo "=== 자동 수리 모드 ==="
            python auto_repair.py
          fi

      - name: 🔁 실패 포스트 자동 재시도 (최대 5개, 7일 이내)
        if: ${{ inputs.dry_run != 'true' }}
        working-directory: blog-automation
        run: |
          echo "=== 실패 포스트 재업로드 시도 ==="
          python main.py --retry --retry-max 5 --retry-age 7 || true

      - name: 🧠 코드 오류 자동 수리 (Claude AI)
        working-directory: blog-automation
        run: |
          DRY="${{ inputs.dry_run || 'false' }}"
          if [ "$DRY" = "true" ]; then
            echo "=== 코드 수리 진단 전용 모드 ==="
            python code_repair.py --dry
          else
            echo "=== 코드 오류 자동 수리 ==="
            python code_repair.py
          fi

      - name: 수리 결과 커밋 & 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in \
            docs/data/auth_health.json \
            docs/data/repairs.json docs/data/pending_posts.json docs/data/pending_bodies.json docs/data/pending_archive.json \
            docs/data/posts.json docs/data/post_details.json docs/data/feature_flags.json docs/data/post_registry.json \
            docs/data/code_repairs.json \
            blog-automation/logs/repair_history.json \
            blog-automation/logs/run_history.json \
            blog-automation/logs/used_keywords.json \
            blog-automation/logs/series.json \
            blog-automation/logs/post_registry.json \
            blog-automation/logs/code_repair.json \
            blog-automation/logs/code_repair_mark.json \
            blog-automation/content_generator.py \
            blog-automation/blogger_uploader.py \
            blog-automation/keyword_collector.py \
            blog-automation/post_manager.py \
            blog-automation/adsense_validator.py \
            blog-automation/main.py \
            blog-automation/auto_repair.py \
            blog-automation/social_publisher.py \
            blog-automation/fix_existing_posts.py \
            blog-automation/coupang_affiliate.py; do
            [ -f "$f" ] && git add -f "$f"
          done
          git add -f blog-automation/logs/post_drafts/ 2>/dev/null || true
          # 자체 호스팅 이미지 — 파일과 매니페스트가 함께 커밋돼야 본문 src가
          # 살아 있습니다. 이 워크플로는 글을 다시 생성해 발행하므로 이미지를
          # docs/images에 쓰고 본문 주소를 우리 도메인으로 바꿉니다. 커밋하지
          # 않으면 러너와 함께 파일이 사라져 발행된 글이 영구 404가 됩니다.
          for f in blog-automation/logs/used_images.json docs/data/image_mirror.json; do [ -f "$f" ] && git add -f "$f"; done
          git add -f docs/images/ 2>/dev/null || true
          true
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 건너뜀"
          else
            git commit -m "🔧 자동 수리 완료 (#${{ github.run_number }})"
            _push_ok=0
            for i in 1 2 3; do
              git rebase --abort 2>/dev/null || true
              if git pull --rebase --autostash origin latest; then
                git push origin latest && { _push_ok=1; break; }
              else
                if git ls-files -u | grep -q .; then
                  for cf in docs/data/post_registry.json blog-automation/logs/post_registry.json; do
                    git checkout --theirs -- "$cf" 2>/dev/null || true
                    git add -f "$cf" 2>/dev/null || true
                  done
                  git rebase --continue --no-edit \
                    && git push origin latest \
                    && { _push_ok=1; break; }
                fi
                git rebase --abort 2>/dev/null || true
              fi
              echo "pull+push 재시도 $i/3..."
              sleep $((i * 3))
            done
            [ "$_push_ok" = "1" ] || { echo "push 3회 실패 — 종료"; exit 1; }
          fi

      - name: 수리 로그 아티팩트
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repair-logs-${{ github.run_number }}
          path: blog-automation/logs/auto_repair.log
          retention-days: 30
