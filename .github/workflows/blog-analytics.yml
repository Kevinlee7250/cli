name: "📊 Blog Analytics — Grade & Revenue"

on:
  schedule:
    # 매주 월요일 09:00 KST (UTC 00:00)
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "미리보기 모드 (파일 변경 없음)"
        type: boolean
        default: false
        required: false
      limit:
        description: "처리할 최대 포스트 수 (0=전체)"
        default: "0"
        required: false
      report_only:
        description: "리포트 저장만 (posts.json 유지)"
        type: boolean
        default: false
        required: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: Run blog analytics
        working-directory: blog-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          DRY_FLAG=""
          REPORT_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry"
          fi
          if [ "${{ inputs.report_only }}" = "true" ]; then
            REPORT_FLAG="--report"
          fi
          LIMIT="${{ inputs.limit }}"
          LIMIT="${LIMIT:-0}"
          python blog_analytics.py $DRY_FLAG $REPORT_FLAG --limit "$LIMIT"

      - name: Commit analytics results
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/posts.json \
                  docs/data/analytics_summary.json \
                  blog-automation/logs/analytics_report.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "📊 블로그 성과 분석 업데이트 — $(date -u +%Y-%m-%d) (S/A/B/C 등급 + 실수익 계산)"
            _push_ok=0
            for i in 1 2 3; do
              git pull --rebase --autostash origin claude/blog-automation-system-KAbtE \
                && git push origin claude/blog-automation-system-KAbtE \
                && { _push_ok=1; break; }
              echo "pull+push 재시도 $i/3..."
              sleep $((i * 3))
            done
            [ "$_push_ok" = "1" ] || { echo "push 3회 실패 — 종료"; exit 1; }
          fi

      - name: Print grade summary
        run: |
          echo "=== 성과 등급 요약 ==="
          python3 -c "
          import json, os
          path = 'docs/data/analytics_summary.json'
          if os.path.exists(path):
              d = json.load(open(path))
              g = d.get('gradeDistribution', {})
              print(f\"S(최우수): {g.get('S',0)}개\")
              print(f\"A(양호):   {g.get('A',0)}개\")
              print(f\"B(기본):   {g.get('B',0)}개\")
              print(f\"C(요주의): {g.get('C',0)}개\")
              print(f\"추정 월수익: \${ d.get('totalEstimatedRevenueMonthly',0):.2f} USD\")
              rt = d.get('rewriteTargets', [])
              if rt:
                  print(f\"리라이팅 대상: {len(rt)}개\")
                  for t in rt[:3]:
                      print(f\"  - {t.get('title','-')[:50]}\")
          else:
              print(\"analytics_summary.json 없음\")
          " || true
