name: 블로그 자동 포스팅

on:
  schedule:
    - cron: '0 23 * * *'   # 오전 8시 KST (UTC 23:00 전날)
    - cron: '0 4 * * *'    # 오후 1시 KST (UTC 04:00)
    - cron: '0 9 * * *'    # 오후 6시 KST (UTC 09:00)
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: pip install -r blog-automation/requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << EOF
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          BLOGGER_CLIENT_ID=${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET=${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_BLOG_ID=${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_REFRESH_TOKEN=${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOG_LANGUAGE=ko
          TREND_COUNTRY=KR
          POSTS_PER_RUN=1
          POST_STATUS=live
          EOF

      - name: 히스토리 복원 (중복 방지)
        working-directory: blog-automation
        run: |
          if [ -f posted_keywords.json ]; then
            echo "히스토리 파일 존재"
          else
            echo "[]" > posted_keywords.json
          fi

      - name: 블로그 포스트 자동 발행
        working-directory: blog-automation
        run: python main.py --once

      - name: 히스토리 커밋 (중복 방지 유지)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog-automation/posted_keywords.json || true
          git diff --staged --quiet || git commit -m "chore: 포스팅 히스토리 업데이트 [skip ci]"
          git push || true
