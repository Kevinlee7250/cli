name: 링크 클러스터 빌드

on:
  workflow_dispatch: {}          # 수동 실행
  schedule:
    - cron: '0 4 * * 0'         # 매주 일요일 04:00 UTC (KST 13:00) — blog-run 정오(03:00 UTC)와 충돌 회피
  push:
    branches: [latest]
    paths:
      - 'docs/data/posts.json'  # posts.json 변경 시 자동 재빌드

permissions:
  contents: write

jobs:
  build-clusters:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5
        with:
          ref: latest

      - name: Python 3.11 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env <<'ENVEOF'
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          LOG_LEVEL=info
          ENVEOF

      # 공개 상태 동기화가 먼저입니다. posts.json은 실행 이력이라 글이
      # 내려간 것을 모르고, 그대로 클러스터를 만들면 새 글이 내려간 글로
      # 링크를 겁니다. 실패해도 클러스터 빌드는 계속합니다 — 그때는
      # related_posts가 필터를 생략하고 예전처럼 동작합니다.
      - name: 공개 글 목록 동기화
        working-directory: blog-automation
        continue-on-error: true
        run: python sync_live_posts.py

      - name: 링크 클러스터 빌드
        working-directory: blog-automation
        run: |
          python related_posts.py --build-clusters
          echo "✅ 클러스터 빌드 완료"

      - name: link_clusters.json 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/data/link_clusters.json 2>/dev/null || true
          git add -f docs/data/live_posts.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 건너뜀"
          else
            git commit -m "🔗 링크 클러스터 재빌드 (#${{ github.run_number }})"
            _push_ok=0
            for i in 1 2 3; do
              git pull --rebase --autostash origin latest \
                && git push origin latest \
                && { _push_ok=1; break; }
              echo "pull+push 재시도 $i/3..."
              sleep $((i * 3))
            done
            [ "$_push_ok" = "1" ] || { echo "push 3회 실패 — 종료"; exit 1; }
          fi
