name: 블로그 최적화 (주 1회 — GSC CTR 개선)

on:
  # 매주 화요일 오전 9시 KST (= UTC 00:00 Tuesday) — 충돌 해결: blog-analytics(월)과 분리
  schedule:
    - cron: '0 0 * * 2'

  # 수동 트리거
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY RUN (제목 후보만 출력, 실제 업데이트 없음)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      limit:
        description: '처리할 포스트 최대 수 (기본값 5)'
        required: false
        default: '5'

permissions:
  contents: write

jobs:
  gsc-optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          GSC_SITE_URL="${{ secrets.GSC_SITE_URL }}"
          ENVEOF

      - name: 로그 디렉토리 생성
        working-directory: blog-automation
        run: mkdir -p logs

      - name: GSC CTR 최적화 실행
        working-directory: blog-automation
        run: |
          DRY="${{ inputs.dry_run || 'false' }}"
          LIMIT="${{ inputs.limit || '5' }}"

          DRY_FLAG=""
          if [ "$DRY" = "true" ]; then
            DRY_FLAG="--dry"
            echo "=== DRY RUN 모드: 제목 후보만 출력, 실제 업데이트 없음 ==="
          else
            echo "=== 실제 최적화 모드: CTR 낮은 포스트 제목 업데이트 ==="
          fi

          python gsc_optimizer.py $DRY_FLAG --limit "$LIMIT"

      - name: 최적화 결과 커밋 (posts.json + 로그)
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 변경된 파일만 스테이징
          git add docs/data/posts.json blog-automation/logs/gsc_optimized.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "변경 사항 없음 — 커밋 건너뜀"
          else
            TIMESTAMP=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
            git commit -m "chore: GSC CTR 최적화 제목 업데이트 ($TIMESTAMP)"
            git push origin claude/blog-automation-system-KAbtE
            echo "커밋 완료"
          fi
