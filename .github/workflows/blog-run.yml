          BLOG_ARG="--blog blog3"

          if [ "$MODE" = "retry" ]; then
            echo "=== blog3 재시도 모드 ==="
            python main.py --retry $BLOG_ARG
          elif [ "$MODE" = "setup" ]; then
            echo "=== blog3 셋업 모드 ==="
            python main.py --setup $BLOG_ARG
          elif [ "$MODE" = "series" ]; then
            echo "=== blog3 시리즈 모드 ==="
            if [ -z "$KEYWORD" ]; then
