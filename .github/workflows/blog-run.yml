  # ────────────────────────────────────────────────────────────
  # Job 3: blog3 게시 — blog2 완료 후 실행
  # ────────────────────────────────────────────────────────────
  publish-blog3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [publish-blog2]
    # blog2가 성공했거나(순차), blog2가 스킵됐거나(blog3 단독 지정), blog3을 명시 지정한 경우
