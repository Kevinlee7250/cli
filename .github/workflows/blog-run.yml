name: 블로그 자동화 실행

on:
  # 매일 오전 7시 (KST) 1회 — 그날 당번 블로그 1개만 발행합니다.
  #
  # ⚠️ 발행량을 줄인 이유 (2026-08-18, INDEXING_DIAGNOSIS.md 참고)
  #   이전: 하루 3회 × 3개 블로그 = 9건/일 → 52일간 478건
  #   결과: 30일 검색 노출 3회, 색인 완료 0건
  #   구글 스팸 정책의 "대규모 콘텐츠 남용" 패턴에 해당해 크롤 예산이
  #   깎인 것으로 진단됐습니다. 색인률이 회복되기 전까지 되돌리지 마세요.
  #
  # 되돌리려면: cron 3줄 복원 + 아래 rotation 잡의 gate를 제거
  schedule:
    - cron: '0 22 * * *'   # 오전 7시 KST (UTC 22:00 전날)

  # 수동 실행
  workflow_dispatch:
    inputs:
      keyword:
        description: '키워드 (예: 2026년 ETF 투자 전략, AI 업무 자동화 — 쉼표로 여러 개 입력, 비워두면 트렌드 자동 수집)'
        required: false
        default: ''
      article_type:
        description: '글 구조 템플릿 (auto = 키워드로 자동 판정)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - how_to
          - comparison
          - explainer
          - review
          - analysis
          - investment
          - news_analysis
          - drama_review
          - kpop_review
          - travel_guide
          - sports_review
      posts_per_run:
        description: '생성할 포스트 수 (1~5, 키워드 여러 개 입력 시 첫 N개만 처리)'
        required: false
        default: '1'
      mode:
        description: '실행 모드'
        required: true
        default: 'live'
        type: choice
        options:
          - live    # Blogger 즉시 게시
          - draft   # 임시저장
          - test    # 업로드 없이 글만 생성 (API 테스트용)
          - review  # 글 생성 후 pending_posts.json에 저장 (수동 검토용)
          - series  # 시리즈 포스트 자동 기획 (keyword 필수)
          - setup   # AdSense 필수 페이지 생성 (개인정보처리방침·블로그 소개)
          - retry   # 실패한 포스트 재시도
      series_count:
        description: '시리즈 편수 (2~5, 드라마 회차별 리뷰는 1~8)'
        required: false
        default: '4'
      series_type:
        description: '시리즈 유형 (series 모드 전용)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto            # 블로그별 자동 기획
          - drama           # 드라마 테마형 리뷰 (첫인상·인물·명장면·총평)
          - drama_episodes  # 드라마 회차별 리뷰 (매 화 1편, keyword=드라마명)
      start_episode:
        description: '회차별 리뷰 시작 회차 (drama_episodes 전용)'
        required: false
        default: '1'
      blog_id:
        description: '특정 블로그 ID (blog1 / blog2 / blog3; 비워두면 세 블로그 순차 실행)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

# 스케줄 실행 중 수동 dispatch가 겹쳐도 동시 실행 방지 (대기 후 순차 실행)
concurrency:
  group: blog-run
  cancel-in-progress: false

# ──────────────────────────────────────────────────────────────
# 공통 스텝을 YAML anchor로 정의 (각 job이 참조)
# ──────────────────────────────────────────────────────────────
# GitHub Actions는 top-level anchor를 지원하지 않으므로
# 각 job에 스텝을 직접 작성합니다.
# ──────────────────────────────────────────────────────────────

jobs:

  # ────────────────────────────────────────────────────────────
  # Job 0: 당번 블로그 결정 (스케줄 실행 전용)
  # ────────────────────────────────────────────────────────────
  # 하루에 블로그 1개만 발행하도록 요일 기준으로 돌아가며 당번을 정합니다.
  # 연중일(day-of-year)을 3으로 나눈 나머지로 배정하므로 3일에 한 번씩
  # 각 블로그 차례가 옵니다 → 블로그당 주 2~3건, 전체 1건/일.
  #
  # 수동 실행(workflow_dispatch)에는 적용되지 않습니다 —
  # 필요할 때 blog_id를 지정해 언제든 발행할 수 있습니다.
  rotation:
    runs-on: ubuntu-latest
    outputs:
      today: ${{ steps.pick.outputs.blog }}
    steps:
      - name: 오늘 당번 블로그 결정
        id: pick
        run: |
          DOY=$(date -u +%j)
          IDX=$(( 10#$DOY % 3 ))
          case "$IDX" in
            0) BLOG=blog1 ;;
            1) BLOG=blog2 ;;
            *) BLOG=blog3 ;;
          esac
          echo "blog=$BLOG" >> "$GITHUB_OUTPUT"
          echo "📅 연중 $DOY 일차 → 오늘 당번: $BLOG"

  # ────────────────────────────────────────────────────────────
  # Job 1: blog1 게시
  # ────────────────────────────────────────────────────────────
  publish-blog1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [rotation]
    # 스케줄이면 당번일 때만, 수동이면 blog_id 미지정(전체 순차) 또는 blog1 지정 시
    if: >
      always() &&
      ((github.event_name == 'schedule' && needs.rotation.outputs.today == 'blog1') ||
       (github.event_name != 'schedule' &&
        (inputs.blog_id == '' || inputs.blog_id == 'blog1')))

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          OPENAI_MODEL="${{ secrets.OPENAI_MODEL || 'gpt-4o' }}"
          AI_PROVIDER="${{ secrets.AI_PROVIDER || 'claude' }}"
          NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}"
          PIXABAY_API_KEY="${{ secrets.PIXABAY_API_KEY }}"
          NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}"
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          ADSENSE_CLIENT_ID="${{ secrets.ADSENSE_CLIENT_ID }}"
          ADSENSE_SLOT_IDS="${{ secrets.ADSENSE_SLOT_IDS }}"
          ADSENSE_MODE=auto
          ADSENSE_MIN_SCORE=80
          GSC_SITE_URL="${{ secrets.GSC_SITE_URL }}"
          INSTAGRAM_ACCESS_TOKEN="${{ secrets.INSTAGRAM_ACCESS_TOKEN }}"
          INSTAGRAM_ACCOUNT_ID="${{ secrets.INSTAGRAM_ACCOUNT_ID }}"
          THREADS_ACCESS_TOKEN="${{ secrets.THREADS_ACCESS_TOKEN }}"
          THREADS_USER_ID="${{ secrets.THREADS_USER_ID }}"
          THREADS_HANDLE="${{ secrets.THREADS_HANDLE }}"
          IMGBB_API_KEY="${{ secrets.IMGBB_API_KEY }}"
          SOCIAL_AUTO_PUBLISH="${{ secrets.SOCIAL_AUTO_PUBLISH }}"
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          BLOG_NAME="${{ secrets.BLOG_NAME }}"
          POSTS_PER_RUN="${{ inputs.posts_per_run || '1' }}"
          # 사람이 고른 글 구조 (auto면 키워드로 자동 판정 — 인자 생략)
          TYPE_ARG=""
          if [ -n "${{ inputs.article_type }}" ] && [ "${{ inputs.article_type }}" != "auto" ]; then
            TYPE_ARG="--article-type ${{ inputs.article_type }}"
          fi
          POST_STATUS="${{ (inputs.mode == 'draft') && 'draft' || 'live' }}"
          BLOG_LANGUAGE=ko
          TREND_COUNTRY=KR
          LOG_LEVEL=info
          LOG_FILE=./logs/automation.log
          ENVEOF

      - name: 로그 디렉토리 생성
        working-directory: blog-automation
        run: |
          mkdir -p logs
          if [ -f logs/automation.log ] && [ "$(wc -l < logs/automation.log)" -gt 500 ]; then
            tail -n 500 logs/automation.log > logs/automation.log.tmp && mv logs/automation.log.tmp logs/automation.log
          fi

      - name: blog1 게시
        working-directory: blog-automation
        run: |
          MODE="${{ inputs.mode || 'live' }}"
          KEYWORD="${{ inputs.keyword }}"
          SERIES_COUNT="${{ inputs.series_count || '4' }}"
          BLOG_ARG="--blog blog1"

          if [ "$MODE" = "retry" ]; then
            echo "=== blog1 재시도 모드 ==="
            python main.py --retry $BLOG_ARG
          elif [ "$MODE" = "setup" ]; then
            echo "=== blog1 셋업 모드 ==="
            python main.py --setup $BLOG_ARG
          elif [ "$MODE" = "series" ]; then
            echo "=== blog1 시리즈 모드 ==="
            if [ -z "$KEYWORD" ]; then
              echo "❌ 시리즈 모드는 keyword 입력이 필수입니다"
              exit 1
            fi
            python main.py --series --series-count "$SERIES_COUNT" --keyword "$KEYWORD" \
              --series-type "${{ inputs.series_type || 'auto' }}" \
              --start-episode "${{ inputs.start_episode || '1' }}" $BLOG_ARG
          elif [ "$MODE" = "test" ]; then
            echo "=== blog1 테스트 모드 ==="
            if [ -n "$KEYWORD" ]; then
              python main.py --test --keyword "$KEYWORD" $BLOG_ARG
            else
              python main.py --test $BLOG_ARG
            fi
          elif [ "$MODE" = "review" ]; then
            echo "=== blog1 검토 모드 ==="
            if [ -n "$KEYWORD" ]; then
              python main.py --review --keyword "$KEYWORD" $BLOG_ARG
            else
              python main.py --review $BLOG_ARG
            fi
          else
            echo "=== blog1 실행 모드: $MODE ==="
            if [ -n "$KEYWORD" ]; then
              python main.py --once --keyword "$KEYWORD" $BLOG_ARG $TYPE_ARG
            else
              python main.py --once $BLOG_ARG $TYPE_ARG
            fi
          fi

      - name: 템플릿 목록 내보내기 (대시보드 선택지)
        if: always()
        working-directory: blog-automation
        run: python template_advisor.py --export || true

      - name: AI 사용량 내보내기 (blog1)
        if: always()
        working-directory: blog-automation
        run: python -c "from config import export_ai_usage_to_docs; export_ai_usage_to_docs()" || true

      # 이름과 달리 개별 URL 색인 요청이 아니라 sitemap.xml 재제출입니다.
      # Indexing API는 JobPosting·BroadcastEvent 전용이고 GSC API에는 색인
      # 요청 엔드포인트가 없어, 개별 URL 요청은 자동화할 수 없습니다.
      - name: 사이트맵 재제출 (blog1)
        if: always()
        working-directory: blog-automation
        run: |
          PUB=$(python -c "import json;print(json.load(open('logs/last_publish_summary.json'))['published'])" 2>/dev/null || echo 0)
          if [ "$PUB" = "0" ]; then
            echo "발행 0건 — 사이트맵 재제출 건너뜀 (새로 알릴 URL이 없음)"
            exit 0
          fi
          # 제출 실패가 발행을 막을 이유는 없지만 흔적은 남깁니다.
          # 결과는 docs/data/sitemap_status.json에 기록됩니다.
          python gsc_indexing.py --submit --blog blog1 \
            || echo "⚠️ 사이트맵 제출 실패 — docs/data/sitemap_status.json 확인"

      - name: 대시보드 데이터 커밋 & 푸시 (blog1)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in \
            docs/data/posts.json docs/data/posts_archive.json docs/data/runs.json \
            docs/data/analytics.json \
            docs/data/meta.json docs/data/pending_posts.json docs/data/pending_bodies.json docs/data/pending_archive.json docs/data/series.json \
            docs/data/gsc.json docs/data/blogs.json docs/data/learning.json \
            docs/data/repairs.json docs/data/social.json docs/data/post_registry.json \
            docs/data/affiliate_links.json docs/data/ai_usage.json docs/ads.txt \
            docs/data/templates.json docs/data/sitemap_status.json \
            blog-automation/logs/run_history.json blog-automation/logs/used_keywords.json \
            blog-automation/logs/series.json blog-automation/logs/learning.json \
            blog-automation/logs/learned_keywords.json blog-automation/logs/automation.log \
            blog-automation/logs/post_registry.json blog-automation/logs/ai_usage.json blog-automation/logs/used_images.json \
            blog-automation/logs/scheduled_keywords.json; do
            [ -f "$f" ] && git add -f "$f"
          done
          # 초안 디렉토리: 업로드 실패 시 재시도용 파일 보존
          git add -f blog-automation/logs/post_drafts/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 건너뜀"
          else
            git commit -m "📊 blog1 게시 완료 (#${{ github.run_number }})"
            _push_ok=0
            for i in 1 2 3; do
              git pull --rebase --autostash origin claude/blog-automation-system-KAbtE \
                && git push origin claude/blog-automation-system-KAbtE \
                && { _push_ok=1; break; }
              echo "push 재시도 $i/3..."
              sleep $((i * 3))
            done
            [ "$_push_ok" = "1" ] || { echo "push 3회 실패 — 종료"; exit 1; }
          fi

      - name: 로그 업로드 (blog1)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs-blog1-${{ github.run_number }}
          path: blog-automation/logs/
          retention-days: 7

      - name: 실패 알림 — blog1 (텔레그램)
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "텔레그램 미설정 — 알림 건너뜀"
            exit 0
          fi
          MSG="🚨 blog1 게시 실패 (#${{ github.run_number }})
          모드: ${{ inputs.mode || 'schedule' }}
          로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" -d text="$MSG" > /dev/null && echo "알림 발송" || echo "알림 실패(무시)"

  # ────────────────────────────────────────────────────────────
  # Job 2: blog2 게시 — blog1 완료 후 실행
  # ────────────────────────────────────────────────────────────
  publish-blog2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [rotation, publish-blog1]
    # blog1이 성공했거나 스킵된 뒤, 스케줄이면 당번일 때만 / 수동이면 기존 규칙대로
    if: >
      always() &&
      (needs.publish-blog1.result == 'success' || needs.publish-blog1.result == 'skipped') &&
      ((github.event_name == 'schedule' && needs.rotation.outputs.today == 'blog2') ||
       (github.event_name != 'schedule' &&
        (inputs.blog_id == '' || inputs.blog_id == 'blog2')))

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          OPENAI_MODEL="${{ secrets.OPENAI_MODEL || 'gpt-4o' }}"
          AI_PROVIDER="${{ secrets.AI_PROVIDER || 'claude' }}"
          NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}"
          PIXABAY_API_KEY="${{ secrets.PIXABAY_API_KEY }}"
          NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}"
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          ADSENSE_CLIENT_ID="${{ secrets.ADSENSE_CLIENT_ID }}"
          ADSENSE_SLOT_IDS="${{ secrets.ADSENSE_SLOT_IDS }}"
          ADSENSE_MODE=auto
          ADSENSE_MIN_SCORE=80
          GSC_SITE_URL="${{ secrets.GSC_SITE_URL }}"
          INSTAGRAM_ACCESS_TOKEN="${{ secrets.INSTAGRAM_ACCESS_TOKEN }}"
          INSTAGRAM_ACCOUNT_ID="${{ secrets.INSTAGRAM_ACCOUNT_ID }}"
          THREADS_ACCESS_TOKEN="${{ secrets.THREADS_ACCESS_TOKEN }}"
          THREADS_USER_ID="${{ secrets.THREADS_USER_ID }}"
          THREADS_HANDLE="${{ secrets.THREADS_HANDLE }}"
          IMGBB_API_KEY="${{ secrets.IMGBB_API_KEY }}"
          SOCIAL_AUTO_PUBLISH="${{ secrets.SOCIAL_AUTO_PUBLISH }}"
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          BLOG_NAME="${{ secrets.BLOG_NAME }}"
          POSTS_PER_RUN="${{ inputs.posts_per_run || '1' }}"
          # 사람이 고른 글 구조 (auto면 키워드로 자동 판정 — 인자 생략)
          TYPE_ARG=""
          if [ -n "${{ inputs.article_type }}" ] && [ "${{ inputs.article_type }}" != "auto" ]; then
            TYPE_ARG="--article-type ${{ inputs.article_type }}"
          fi
          POST_STATUS="${{ (inputs.mode == 'draft') && 'draft' || 'live' }}"
          BLOG_LANGUAGE=ko
          TREND_COUNTRY=KR
          LOG_LEVEL=info
          LOG_FILE=./logs/automation.log
          ENVEOF

      - name: 로그 디렉토리 생성
        working-directory: blog-automation
        run: |
          mkdir -p logs
          if [ -f logs/automation.log ] && [ "$(wc -l < logs/automation.log)" -gt 500 ]; then
            tail -n 500 logs/automation.log > logs/automation.log.tmp && mv logs/automation.log.tmp logs/automation.log
          fi

      - name: blog2 게시
        working-directory: blog-automation
        run: |
          MODE="${{ inputs.mode || 'live' }}"
          KEYWORD="${{ inputs.keyword }}"
          SERIES_COUNT="${{ inputs.series_count || '4' }}"
          BLOG_ARG="--blog blog2"

          if [ "$MODE" = "retry" ]; then
            echo "=== blog2 재시도 모드 ==="
            python main.py --retry $BLOG_ARG
          elif [ "$MODE" = "setup" ]; then
            echo "=== blog2 셋업 모드 ==="
            python main.py --setup $BLOG_ARG
          elif [ "$MODE" = "series" ]; then
            echo "=== blog2 시리즈 모드 ==="
            if [ -z "$KEYWORD" ]; then
              echo "❌ 시리즈 모드는 keyword 입력이 필수입니다"
              exit 1
            fi
            python main.py --series --series-count "$SERIES_COUNT" --keyword "$KEYWORD" \
              --series-type "${{ inputs.series_type || 'auto' }}" \
              --start-episode "${{ inputs.start_episode || '1' }}" $BLOG_ARG
          elif [ "$MODE" = "test" ]; then
            echo "=== blog2 테스트 모드 ==="
            if [ -n "$KEYWORD" ]; then
              python main.py --test --keyword "$KEYWORD" $BLOG_ARG
            else
              python main.py --test $BLOG_ARG
            fi
          elif [ "$MODE" = "review" ]; then
            echo "=== blog2 검토 모드 ==="
            if [ -n "$KEYWORD" ]; then
              python main.py --review --keyword "$KEYWORD" $BLOG_ARG
            else
              python main.py --review $BLOG_ARG
            fi
          else
            echo "=== blog2 실행 모드: $MODE ==="
            if [ -n "$KEYWORD" ]; then
              python main.py --once --keyword "$KEYWORD" $BLOG_ARG $TYPE_ARG
            else
