      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
