name: 블로그 자동화 실행

on:
  # 매일 오전 7시 + 오후 7시 (KST) = UTC 22:00 / 10:00
  schedule:
    - cron: '0 22 * * *'   # 오전 7시 KST
    - cron: '0 10 * * *'   # 오후 7시 KST

  # 수동 실행
  workflow_dispatch:
    inputs:
      keyword:
        description: '키워드 (예: 2026년 ETF 투자 전략, AI 업무 자동화 — 쉼표로 여러 개 입력, 비워두면 트렌드 자동 수집)'
        required: false
        default: ''
      posts_per_run:
        description: '생성할 포스트 수 (1~5, 키워드 여러 개 입력 시 첫 N개만 처리)'
        required: false
        default: '3'
      mode:
        description: '실행 모드'
        required: true
        default: 'live'
        type: choice
        options:
          - live    # Blogger 즉시 게시
          - draft   # 임시저장
          - test    # 업로드 없이 글만 생성 (API 테스트용)
          - review  # 글 생성 후 pending_posts.json에 저장 (수동 검토용)
          - series  # 시리즈 포스트 자동 기획 (keyword 필수)
          - setup   # AdSense 필수 페이지 생성 (개인정보처리방침·블로그 소개)
      series_count:
        description: '시리즈 편수 (2~5, series 모드에서만 사용)'
        required: false
        default: '4'
      blog_id:
        description: '특정 블로그 ID (BLOGS_CONFIG의 id 값; 비워두면 모든 블로그 실행)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-blog-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}"
          NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}"
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          ADSENSE_CLIENT_ID="${{ secrets.ADSENSE_CLIENT_ID }}"
          ADSENSE_SLOT_IDS="${{ secrets.ADSENSE_SLOT_IDS }}"
          GSC_SITE_URL="${{ secrets.GSC_SITE_URL }}"
          BLOGS_CONFIG="${{ secrets.BLOGS_CONFIG }}"
          BLOG_NAME="${{ secrets.BLOG_NAME }}"
          POSTS_PER_RUN="${{ inputs.posts_per_run || '3' }}"
          POST_STATUS="${{ (inputs.mode == 'draft') && 'draft' || 'live' }}"
          BLOG_LANGUAGE=ko
          TREND_COUNTRY=KR
          LOG_LEVEL=info
          LOG_FILE=./logs/automation.log
          ENVEOF

      - name: 로그 디렉토리 생성
        working-directory: blog-automation
        run: mkdir -p logs

      - name: 블로그 자동화 실행
        working-directory: blog-automation
        run: |
          MODE="${{ inputs.mode || 'live' }}"
          KEYWORD="${{ inputs.keyword }}"

          SERIES_COUNT="${{ inputs.series_count || '4' }}"

          BLOG_ARG=""
          if [ -n "${{ inputs.blog_id }}" ]; then
            BLOG_ARG="--blog ${{ inputs.blog_id }}"
          fi

          if [ "$MODE" = "setup" ]; then
            echo "=== 셋업 모드: AdSense 필수 페이지 생성 (개인정보처리방침·블로그 소개) ==="
            python main.py --setup $BLOG_ARG
          elif [ "$MODE" = "series" ]; then
            echo "=== 시리즈 모드: 주제를 ${SERIES_COUNT}편으로 분할 ==="
            if [ -z "$KEYWORD" ]; then
              echo "❌ 시리즈 모드는 keyword 입력이 필수입니다"
              exit 1
            fi
            python main.py --series --series-count "$SERIES_COUNT" --keyword "$KEYWORD" $BLOG_ARG
          elif [ "$MODE" = "test" ]; then
            echo "=== 테스트 모드: 업로드 없이 글만 생성 ==="
            if [ -n "$KEYWORD" ]; then
              python main.py --test --keyword "$KEYWORD" $BLOG_ARG
            else
              python main.py --test $BLOG_ARG
            fi
          elif [ "$MODE" = "review" ]; then
            echo "=== 검토 모드: pending_posts.json에 저장 ==="
            if [ -n "$KEYWORD" ]; then
              python main.py --review --keyword "$KEYWORD" $BLOG_ARG
            else
              python main.py --review $BLOG_ARG
            fi
          else
            echo "=== 실행 모드: $MODE ==="
            if [ -n "$KEYWORD" ]; then
              python main.py --once --keyword "$KEYWORD" $BLOG_ARG
            else
              python main.py --once $BLOG_ARG
            fi
          fi

      - name: 대시보드 데이터 커밋 & 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # docs/data/ 는 tracked 파일 (-f: 루트 .gitignore /*  규칙 우회)
          git add -f docs/data/posts.json docs/data/runs.json docs/data/analytics.json docs/data/meta.json docs/data/pending_posts.json docs/data/series.json docs/data/gsc.json docs/data/blogs.json 2>/dev/null || true
          git add blog-automation/logs/run_history.json blog-automation/logs/used_keywords.json blog-automation/logs/series.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 건너뜀"
          else
            git commit -m "📊 대시보드 데이터 업데이트 (#${{ github.run_number }})"
            # 코드 변경 커밋이 먼저 Push된 경우를 대비해 rebase 후 push
            git pull --rebase origin claude/blog-automation-system-KAbtE
            git push origin claude/blog-automation-system-KAbtE
          fi

      - name: 로그 업로드 (아티팩트)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs-${{ github.run_number }}
          path: blog-automation/logs/
          retention-days: 7
