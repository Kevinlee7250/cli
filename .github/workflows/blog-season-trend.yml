name: "🌿 Blog Season Trend Scheduler"

on:
  schedule:
    # 매주 일요일 08:00 KST (UTC 23:00 토요일)
    - cron: "0 23 * * 6"
  workflow_dispatch:
    inputs:
      days:
        description: "탐지 윈도우 (일)"
        required: false
        default: "14"
      preview:
        description: "미리보기 모드 (저장 없음)"
        type: boolean
        required: false
        default: false

jobs:
  season-trend:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: Run trend scheduler
        working-directory: blog-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: |
          PREVIEW_FLAG=""
          if [ "${{ inputs.preview }}" = "true" ]; then
            PREVIEW_FLAG="--preview"
          fi
          DAYS="${{ inputs.days }}"
          DAYS="${DAYS:-14}"
          python trend_scheduler.py --days "$DAYS" $PREVIEW_FLAG

      - name: Commit updated scheduled_keywords.json
        if: ${{ inputs.preview != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog-automation/logs/scheduled_keywords.json || true
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "🌿 시즌 트렌드 예약 키워드 큐 업데이트 ($(date -u +%Y-%m-%d))"
            for i in 1 2 3; do
              git pull --rebase --autostash origin claude/blog-automation-system-KAbtE \
                && git push origin claude/blog-automation-system-KAbtE \
                && break
              echo "pull+push 재시도 $i/3..."
              sleep $((i * 3))
            done
          fi
