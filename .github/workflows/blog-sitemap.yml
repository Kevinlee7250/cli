name: 사이트맵 생성 (블로그 포스트 업데이트 후 자동 실행)

on:
  # blog-run.yml 완료 후 자동 실행 (의존성 체인)
  workflow_run:
    workflows: ["블로그 자동화 실행"]
    types: [completed]
    branches: [latest]

  # 수동 실행
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    # blog-run이 성공한 경우에만 실행 (실패 시 스킵)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5
        with:
          ref: latest

      - name: Python 3.11 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 사이트맵 생성
        # 예전에는 이 자리에 파이썬을 heredoc으로 인라인했습니다. 같은 이름의
        # 모듈이 따로 있었지만 아무도 부르지 않아 구현이 두 벌이었고, 도는
        # 쪽에는 테스트가 없었습니다. 그 사이 커스텀 도메인 블로그가 통째로
        # 사이트맵에서 빠진 채 오래 돌았습니다 — 워크플로는 계속 초록이었고요.
        working-directory: blog-automation
        run: python sitemap_generator.py

      - name: 사이트맵 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for f in docs/sitemap.xml docs/robots.txt; do [ -f "$f" ] && git add -f "$f"; done

          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 건너뜀"
          else
            TIMESTAMP=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
            git commit -m "chore: 사이트맵 자동 갱신 ($TIMESTAMP)"
            _push_ok=0
            for i in 1 2 3; do
              git pull --rebase --autostash origin latest \
                && git push origin latest \
                && { _push_ok=1; break; }
              echo "pull+push 재시도 $i/3..."
              sleep $((i * 3))
            done
            [ "$_push_ok" = "1" ] || { echo "push 3회 실패 — 종료"; exit 1; }
            echo "✅ 커밋 완료"
          fi
