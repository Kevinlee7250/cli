name: 🤖 시스템 관리봇 응답

on:
  workflow_dispatch:
    inputs:
      message:
        description: '사용자 메시지'
        required: true
      reply_id:
        description: '응답 추적 ID'
        required: true
      context_json:
        description: '시스템 컨텍스트 JSON'
        required: false
        default: '{}'

permissions:
  contents: write

jobs:
  bot-reply:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: anthropic·openai 설치
        run: pip install anthropic openai -q

      - name: Claude 응답 생성 (한도 시 OpenAI 폴백)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          USER_MESSAGE: ${{ inputs.message }}
          REPLY_ID: ${{ inputs.reply_id }}
          CONTEXT_JSON: ${{ inputs.context_json }}
        run: |
          python3 - <<'PYEOF'
          import os, json, anthropic, datetime

          client = anthropic.Anthropic(api_key=os.environ["ANTHROPIC_API_KEY"])
          user_msg = os.environ["USER_MESSAGE"]
          reply_id = os.environ["REPLY_ID"]

          try:
            ctx = json.loads(os.environ.get("CONTEXT_JSON", "{}"))
          except Exception:
            ctx = {}

          # 시스템 컨텍스트 구성
          system_parts = [
            "당신은 블로그 자동화 시스템의 관리봇입니다. Claude Haiku 모델 기반으로 시스템 상태를 분석하고 조언합니다.",
            "응답은 간결하고 실용적으로 한국어로 작성하세요.",
          ]
          ctx_for_system = {k: v for k, v in ctx.items() if k != 'history'}
          if ctx_for_system:
            system_parts.append(f"\n현재 시스템 상태:\n{json.dumps(ctx_for_system, ensure_ascii=False, indent=2)}")

          # 대화 히스토리 복원 (있는 경우)
          history = ctx.get('history') or []
          messages = []
          for h in history:
            role = h.get('role')
            content = h.get('content', '')
            if role in ('user', 'assistant') and content:
              messages.append({'role': role, 'content': content})
          # 현재 메시지가 히스토리에 이미 포함되어 있지 않으면 추가
          if not messages or messages[-1].get('content') != user_msg:
            messages.append({'role': 'user', 'content': user_msg})

          def _openai_reply(system_text, msgs):
            """Claude 한도 도달 시 OpenAI 폴백. 키 없으면 None."""
            oa_key = os.environ.get("OPENAI_API_KEY", "").strip()
            if not oa_key:
              return None
            from openai import OpenAI
            oa = OpenAI(api_key=oa_key)
            resp = oa.chat.completions.create(
              model="gpt-4o-mini",
              max_tokens=1024,
              messages=[{"role": "system", "content": system_text}] + msgs,
            )
            return resp.choices[0].message.content or ""

          model_used = "claude-haiku-4-5-20251001"
          try:
            response = client.messages.create(
              model="claude-haiku-4-5-20251001",
              max_tokens=1024,
              system="\n".join(system_parts),
              messages=messages
            )
            reply_text = response.content[0].text
            error_flag = None
          except Exception as api_err:
            err_str = str(api_err)
            if "usage limits" in err_str or "rate_limit" in err_str or "overloaded" in err_str:
              print(f"[WARN] Claude 한도/과부하 — OpenAI 폴백 시도: {err_str}")
              try:
                fallback = _openai_reply("\n".join(system_parts), messages)
              except Exception as oa_err:
                print(f"[WARN] OpenAI 폴백도 실패: {oa_err}")
                fallback = None
              if fallback:
                reply_text = fallback
                error_flag = None
                model_used = "gpt-4o-mini (Claude 한도 폴백)"
              else:
                reply_text = (
                  "⚠️ API 사용 한도에 도달했습니다. 다음 달 초(08/01 UTC)에 자동으로 복구됩니다.\n"
                  "OPENAI_API_KEY Secret을 설정하면 한도 기간에도 GPT로 응답할 수 있습니다."
                )
                error_flag = "api_limit"
            else:
              raise

          # docs/data/bot_reply.json 저장
          os.makedirs("docs/data", exist_ok=True)
          result = {
            "reply_id": reply_id,
            "message": user_msg,
            "reply": reply_text,
            "timestamp": datetime.datetime.utcnow().isoformat() + "Z",
            "model": model_used,
          }
          if error_flag:
            result["error"] = error_flag
          with open("docs/data/bot_reply.json", "w", encoding="utf-8") as f:
            json.dump(result, f, ensure_ascii=False, indent=2)
          print(f"✅ 응답 저장 완료 (reply_id={reply_id})")
          PYEOF

      - name: 응답 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # bot_reply.json 내용 보존 후 최신 원격 상태로 리셋 (충돌 방지)
          cp docs/data/bot_reply.json /tmp/bot_reply.json
          git fetch origin claude/blog-automation-system-KAbtE
          git reset --hard origin/claude/blog-automation-system-KAbtE
          cp /tmp/bot_reply.json docs/data/bot_reply.json
          git add -f docs/data/bot_reply.json
          git diff --staged --quiet && echo "변경없음" && exit 0
          git commit -m "🤖 봇 응답 (#${{ github.run_number }})"
          for i in 1 2 3; do
            git push origin claude/blog-automation-system-KAbtE && break
            echo "push 재시도 $i/3 — 원격 변경분 반영 후 재시도"
            git pull --rebase --autostash origin claude/blog-automation-system-KAbtE || true
            sleep $((i * 2))
          done
