name: 🗑️ 저성과 등급 글 삭제 (S/A/B/C)

on:
  push:
    branches: [claude/blog-automation-system-KAbtE]
    paths: ['.github/delete-low-grade-trigger']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '미리보기만 (실제 삭제 없음)'
        type: boolean
        required: false
        default: true
      grades:
        description: '삭제 대상 등급 (쉼표 구분, 예: B,C)'
        required: false
        default: 'B,C'
      blog_id:
        description: '특정 블로그 ID (비워두면 전체)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: delete-low-grade-posts
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          LOG_LEVEL=info
          ENVEOF

      - name: 저성과 글 스캔·삭제
        working-directory: blog-automation
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "push" ]; then
            # push 트리거는 트리거 파일 내용으로 모드 결정: "dry-run" 또는 "delete:B,C"
            MODE=$(cat ../.github/delete-low-grade-trigger 2>/dev/null | head -1)
            if [[ "$MODE" == delete:* ]]; then
              ARGS="--grades ${MODE#delete:}"
            else
              ARGS="--dry-run"
            fi
          else
            [ "${{ inputs.dry_run }}" = "false" ] || ARGS="--dry-run"
            ARGS="$ARGS --grades ${{ inputs.grades || 'B,C' }}"
            [ -n "${{ inputs.blog_id }}" ] && ARGS="$ARGS --blog ${{ inputs.blog_id }}"
          fi
          echo "실행 모드: $ARGS"
          python delete_low_grade_posts.py $ARGS

      - name: 결과 커밋 & 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/data/grade_cleanup.json docs/data/posts.json docs/data/post_registry.json \
                     blog-automation/logs/post_registry.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "🗑️ 저성과 글 정리 (#${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase --autostash origin claude/blog-automation-system-KAbtE \
                && git push origin claude/blog-automation-system-KAbtE && break
              sleep $((i * 2))
            done
          fi
