name: 📢 쿠팡 고지 문구 교체 (발행 글 일괄)

# 발행된 글에 남아 있는 옛 고지 문구를 현재 기준으로 맞춥니다.
#
#   문구   "이 포스트는 … 제공받을 수 있습니다"  (임의로 완화된 표현)
#   스타일  font-size:10px · color:#bbb          (흰 배경에서 읽히지 않음)
#
# 표시광고법상 대가를 받은 추천은 소비자가 "쉽게 인식할 수 있는" 방법으로
# 알려야 합니다. 새로 쓰는 글은 coupang_affiliate가 처리하므로, 이 워크플로는
# 이미 나간 글을 한 번 정리하는 용도입니다. 스케줄은 두지 않습니다.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '미리보기만 (실제 수정 없음)'
        type: boolean
        required: false
        default: true
      blog_id:
        description: '특정 블로그 ID (비워두면 전체 블로그)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fix-affiliate-disclosure
  cancel-in-progress: false

jobs:
  fix-disclosure:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5
        with:
          ref: latest

      - name: Python 3.11 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          LOG_LEVEL=info
          ENVEOF

      - name: 고지 문구 스캔 및 교체
        working-directory: blog-automation
        run: |
          mkdir -p logs
          # 발행 글을 바꾸는 작업이라 기본값은 미리보기입니다.
          ARGS=""
          if [ "${{ inputs.dry_run }}" != "false" ]; then
            ARGS="--dry-run"
            echo "=== 미리보기 모드 (실제 수정 없음) ==="
          fi
          if [ -n "${{ inputs.blog_id }}" ]; then
            ARGS="$ARGS --blog ${{ inputs.blog_id }}"
          fi
          python fix_affiliate_disclosure.py $ARGS

      - name: 리포트 커밋 & 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # docs/.gitignore(npm/cli 템플릿)가 docs/* 를 무시하므로 -f 필요
          git add -f docs/data/affiliate_disclosure.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "📢 쿠팡 고지 문구 점검 (#${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase --autostash origin latest \
                && git push origin latest && break
              sleep $((i * 3))
            done
          fi
