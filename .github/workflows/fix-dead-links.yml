name: 🔗 죽은 링크 스캔·수정 (AdSense 탐색 정책)

on:
  push:
    branches: [latest]
    paths: ['.github/dead-links-trigger']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '미리보기만 (실제 수정 없음)'
        type: boolean
        required: false
        default: true
      blog_id:
        description: '특정 블로그 ID (비워두면 전체)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fix-dead-links
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: latest

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          LOG_LEVEL=info
          ENVEOF

      - name: 죽은 링크 스캔
        working-directory: blog-automation
        run: |
          mkdir -p logs
          ARGS=""
          # push 트리거는 트리거 파일 내용으로 모드 결정 (dry-run / fix)
          if [ "${{ github.event_name }}" = "push" ]; then
            MODE=$(cat ../.github/dead-links-trigger 2>/dev/null | head -1)
            [ "$MODE" = "fix" ] || ARGS="--dry-run"
          else
            [ "${{ inputs.dry_run }}" = "false" ] || ARGS="--dry-run"
            [ -n "${{ inputs.blog_id }}" ] && ARGS="$ARGS --blog ${{ inputs.blog_id }}"
          fi
          echo "실행 모드: $ARGS"
          python fix_dead_links.py $ARGS

      - name: 리포트 커밋 & 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/data/dead_links.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "🔗 죽은 링크 리포트 (#${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase --autostash origin latest \
                && git push origin latest && break
              sleep $((i * 2))
            done
          fi
