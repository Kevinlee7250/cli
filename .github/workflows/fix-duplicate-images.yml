name: 🖼️ 중복 이미지 교체 (발행 글 일괄)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '미리보기만 (실제 수정 없음)'
        type: boolean
        required: false
        default: false
      blog_id:
        description: '특정 블로그 ID (비워두면 전체 블로그)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fix-duplicate-images
  cancel-in-progress: false

jobs:
  fix-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt pillow

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}"
          NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}"
          PIXABAY_API_KEY="${{ secrets.PIXABAY_API_KEY }}"
          IMGBB_API_KEY="${{ secrets.IMGBB_API_KEY }}"
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          LOG_LEVEL=info
          ENVEOF

      - name: 중복 이미지 스캔 및 교체
        working-directory: blog-automation
        run: |
          mkdir -p logs
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
            echo "=== 미리보기 모드 (실제 수정 없음) ==="
          fi
          if [ -n "${{ inputs.blog_id }}" ]; then
            ARGS="$ARGS --blog ${{ inputs.blog_id }}"
          fi
          python fix_duplicate_images.py $ARGS

      - name: 결과 커밋 & 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/data/duplicate_images.json 2>/dev/null || true
          git add -f blog-automation/logs/used_images.json docs/data/image_mirror.json 2>/dev/null || true
          # 자체 호스팅 이미지 — 파일과 매니페스트가 함께 커밋돼야 본문 src가 살아 있습니다
          git add -f docs/images/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 건너뜀"
          else
            git commit -m "🖼️ 중복 이미지 교체 리포트 (#${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase --autostash origin claude/blog-automation-system-KAbtE \
                && git push origin claude/blog-automation-system-KAbtE && break
              echo "push 재시도 $i/3..."
              sleep $((i * 2))
            done
          fi
