name: 🔄 AdSense 미달 포스트 일괄 수정

on:
  # blog-automation/fix_trigger.json 변경 시 자동 실행 (파라미터는 파일에서 읽음)
  push:
    branches: [claude/blog-automation-system-KAbtE]
    paths:
      - 'blog-automation/fix_trigger.json'

  workflow_dispatch:
    inputs:
      batch_size:
        description: '한 번에 처리할 포스트 수 (기본 10, 최대 20)'
        required: false
        default: '10'
        type: string
      blog_id:
        description: '특정 블로그만 처리 (비어 있으면 전체)'
        required: false
        default: ''
        type: string
      offset:
        description: '시작 인덱스 (이전 실행 이어서 할 때 사용)'
        required: false
        default: '0'
        type: string
      dry_run:
        description: '실제 업데이트 없이 대상 목록만 확인'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: fix-posts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fix-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          OPENAI_MODEL="${{ secrets.OPENAI_MODEL || 'gpt-4o' }}"
          AI_PROVIDER="${{ secrets.AI_PROVIDER || 'claude' }}"
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          BLOG_NAME="${{ secrets.BLOG_NAME }}"
          ADSENSE_CLIENT_ID="${{ secrets.ADSENSE_CLIENT_ID }}"
          ADSENSE_SLOT_IDS="${{ secrets.ADSENSE_SLOT_IDS }}"
          LOG_LEVEL=info
          ENVEOF

      - name: 로그 디렉토리 생성
        working-directory: blog-automation
        run: mkdir -p logs

      - name: 📋 AdSense 미달 포스트 현황 확인
        working-directory: blog-automation
        run: |
          python3 -c "
          import json, sys
          sys.path.insert(0, '.')
          from pathlib import Path
          registry = json.loads((Path('..') / 'docs/data/post_registry.json').read_text())
          published = [p for p in registry if p.get('status') == 'published']
          failing = [p for p in published if (p.get('wordCount') or 0) < 4000 and p.get('blogUrl')]
          fixed_path = Path('logs/fix_history.json')
          fixed_ids = set()
          if fixed_path.exists():
              h = json.loads(fixed_path.read_text())
              fixed_ids = {r['post_id'] for r in h.get('fixed', [])}
          remaining = [p for p in failing if p.get('post_id','') not in fixed_ids]
          print(f'게시 포스트: {len(published)}개')
          print(f'AdSense 미달 (4000자 미만): {len(failing)}개')
          print(f'이미 수정 완료: {len(fixed_ids)}개')
          print(f'남은 미수정: {len(remaining)}개')
          from collections import Counter
          c = Counter(p.get('blogId','?') for p in remaining)
          for k,v in sorted(c.items()): print(f'  {k}: {v}개')
          "

      - name: 🔄 미달 포스트 일괄 수정 실행
        working-directory: blog-automation
        run: |
          # push 트리거면 fix_trigger.json에서, workflow_dispatch면 inputs에서 파라미터 읽기
          if [ "${{ github.event_name }}" = "push" ] && [ -f fix_trigger.json ]; then
            BATCH=$(python3 -c "import json; d=json.load(open('fix_trigger.json')); print(d.get('batch_size',10))")
            BLOG=$(python3 -c "import json; d=json.load(open('fix_trigger.json')); print(d.get('blog_id',''))")
            OFFSET=$(python3 -c "import json; d=json.load(open('fix_trigger.json')); print(d.get('offset',0))")
            DRY=$(python3 -c "import json; d=json.load(open('fix_trigger.json')); print(str(d.get('dry_run',False)).lower())")
            echo "=== push 트리거: fix_trigger.json에서 파라미터 읽음 ==="
            cat fix_trigger.json
          else
            BATCH="${{ inputs.batch_size || '10' }}"
            BLOG="${{ inputs.blog_id }}"
            OFFSET="${{ inputs.offset || '0' }}"
            DRY="${{ inputs.dry_run || 'false' }}"
          fi

          ARGS="--batch-size ${BATCH} --min-words 4000"
          [ -n "${BLOG}" ] && ARGS="$ARGS --blog-id ${BLOG}"
          [ "${OFFSET}" != "0" ] && ARGS="$ARGS --offset ${OFFSET}"
          [ "${DRY}" = "true" ] && ARGS="$ARGS --dry-run"

          echo "=== 실행 인수: $ARGS ==="
          python fix_existing_posts.py $ARGS

      - name: 📊 수정 결과 저장 및 커밋
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in \
            blog-automation/logs/fix_history.json \
            blog-automation/logs/fix_posts.log \
            docs/data/post_registry.json; do
            [ -f "$f" ] && git add -f "$f"
          done
          true
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 건너뜀"
          else
            git commit -m "🔄 AdSense 미달 포스트 일괄 수정 (#${{ github.run_number }})"
            _push_ok=0
            for i in 1 2 3; do
              git pull --rebase --autostash origin claude/blog-automation-system-KAbtE \
                && git push origin claude/blog-automation-system-KAbtE \
                && { _push_ok=1; break; }
              echo "pull+push 재시도 $i/3..."
              sleep $((i * 3))
            done
            [ "$_push_ok" = "1" ] || { echo "push 3회 실패 — 종료"; exit 1; }
          fi

      - name: 로그 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-posts-logs-${{ github.run_number }}
          path: |
            blog-automation/logs/fix_posts.log
            blog-automation/logs/fix_history.json
          retention-days: 30
