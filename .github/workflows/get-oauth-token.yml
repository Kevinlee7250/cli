name: 🔑 Google OAuth 토큰 발급

on:
  push:
    branches: [claude/blog-automation-system-KAbtE]
    paths: ['.github/oauth-token-trigger']
  workflow_dispatch:
    inputs:
      step:
        description: '실행 단계'
        required: true
        type: choice
        options:
          - '1_get_url'
          - '2_exchange_code'
        default: '1_get_url'
      scope:
        description: 'OAuth 스코프 선택'
        required: true
        type: choice
        options:
          - 'blogger+gsc'
          - 'drive'
        default: 'blogger+gsc'
      auth_code:
        description: '[2단계] Google에서 받은 인증 코드 (1단계 URL 방문 후 입력)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  get-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE

      - name: 실행 모드 결정 (push 트리거 파일 또는 workflow_dispatch 입력)
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            LINE=$(cat .github/oauth-token-trigger 2>/dev/null | head -1)
            if [[ "$LINE" == 2_exchange_code:* ]]; then
              echo "step_mode=2_exchange_code" >> "$GITHUB_ENV"
              echo "auth_code_value=${LINE#2_exchange_code:}" >> "$GITHUB_ENV"
            else
              echo "step_mode=1_get_url" >> "$GITHUB_ENV"
              echo "auth_code_value=" >> "$GITHUB_ENV"
            fi
            echo "scope_value=blogger+gsc" >> "$GITHUB_ENV"
          else
            echo "step_mode=${{ inputs.step }}" >> "$GITHUB_ENV"
            echo "auth_code_value=${{ inputs.auth_code }}" >> "$GITHUB_ENV"
            echo "scope_value=${{ inputs.scope }}" >> "$GITHUB_ENV"
          fi

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: requests 설치
        run: pip install requests -q

      - name: 🔗 1단계 — 인증 URL 생성
        if: ${{ env.step_mode == '1_get_url' }}
        env:
          CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          SCOPE_CHOICE: ${{ env.scope_value }}
        run: |
          python3 - <<'PYEOF'
          import os, urllib.parse
          client_id    = os.environ["CLIENT_ID"]
          scope_choice = os.environ.get("SCOPE_CHOICE", "blogger+gsc")

          if scope_choice == "drive":
              scope = "https://www.googleapis.com/auth/drive.file"
              scope_label = "Google Drive (drive.file)"
          else:
              scope = "https://www.googleapis.com/auth/blogger https://www.googleapis.com/auth/webmasters"
              scope_label = "Blogger + Search Console"

          params = {
              "client_id":     client_id,
              "redirect_uri":  "http://localhost",
              "response_type": "code",
              "scope":         scope,
              "access_type":   "offline",
              "prompt":        "consent",
          }
          url = "https://accounts.google.com/o/oauth2/auth?" + urllib.parse.urlencode(params)
          print("=" * 60)
          print(f"스코프: {scope_label}")
          print()
          print("아래 URL을 브라우저에서 열고 Google 계정으로 로그인하세요:")
          print()
          print(url)  # GitHub 로그에서는 client_id가 자동 마스킹됨 — 실제 값은 업로드되는 아티팩트에서 확인
          print()
          print("=" * 60)
          print("로그인·동의 후 브라우저가 http://localhost/?code=...&scope=... 로 이동하며")
          print("'사이트에 연결할 수 없음' 오류 페이지가 뜹니다 (정상 — localhost에 서버가 없어서).")
          print("이때 주소창의 URL에서 'code=' 뒤부터 '&scope=' 앞까지를 복사하세요 (URL 디코딩 필요할 수 있음).")
          print("그 다음 이 워크플로우를 step=2_exchange_code 로 재실행하고")
          print("auth_code 항목에 복사한 코드를 붙여넣으세요.")
          print()
          print("⚠️ 'redirect_uri_mismatch' 오류가 뜨면 Google Cloud Console → API 및 서비스 →")
          print("사용자 인증 정보 → 이 OAuth 클라이언트 → '승인된 리디렉션 URI'에")
          print("http://localhost 를 추가해야 합니다.")

          # 로그는 시크릿 마스킹으로 client_id가 ***로 가려지므로,
          # 아티팩트(네트워크 정책상 다운로드 불가할 수 있음) + git 커밋 파일로 이중 저장
          with open("oauth_url.txt", "w") as f:
              f.write(url + "\n")
          PYEOF

      - name: 인증 URL 아티팩트 업로드
        if: ${{ env.step_mode == '1_get_url' }}
        uses: actions/upload-artifact@v4
        with:
          name: oauth-auth-url
          path: oauth_url.txt
          retention-days: 1

      - name: 인증 URL 임시 커밋 (client_id는 공개 식별자 — 사용 후 삭제 권장)
        if: ${{ env.step_mode == '1_get_url' }}
        run: |
          cp oauth_url.txt .github/oauth_url_output.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .github/oauth_url_output.txt
          if git diff --staged --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "🔑 OAuth 인증 URL 출력 (임시 — 확인 후 삭제 권장)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin claude/blog-automation-system-KAbtE \
                && git push origin claude/blog-automation-system-KAbtE && break
              sleep $((i * 2))
            done
          fi

      - name: 🔄 2단계 — 코드 교환 및 Refresh Token 출력
        if: ${{ env.step_mode == '2_exchange_code' }}
        env:
          CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AUTH_CODE: ${{ env.auth_code_value }}
          SCOPE_CHOICE: ${{ env.scope_value }}
        run: |
          python3 - <<'PYEOF'
          import os, requests

          client_id     = os.environ["CLIENT_ID"]
          client_secret = os.environ["CLIENT_SECRET"]
          auth_code     = os.environ["AUTH_CODE"].strip()
          scope_choice  = os.environ.get("SCOPE_CHOICE", "blogger+gsc")

          if not auth_code:
              print("❌ auth_code 가 비어 있습니다. 1단계 URL을 먼저 방문하세요.")
              exit(1)

          resp = requests.post("https://oauth2.googleapis.com/token", data={
              "code":          auth_code,
              "client_id":     client_id,
              "client_secret": client_secret,
              "redirect_uri":  "http://localhost",
              "grant_type":    "authorization_code",
          })

          data = resp.json()

          if "refresh_token" not in data:
              print(f"❌ 토큰 교환 실패: {data}")
              exit(1)

          refresh_token = data["refresh_token"]

          if scope_choice == "drive":
              secret_name = "GOOGLE_DRIVE_REFRESH_TOKEN"
              save_hint   = "1. GitHub Secrets → GOOGLE_DRIVE_REFRESH_TOKEN 에 저장\n2. 백업 워크플로우(backup.yml)가 이 토큰을 사용합니다."
          else:
              secret_name = "GOOGLE_REFRESH_TOKEN"
              save_hint   = "1. GitHub Secrets → GOOGLE_REFRESH_TOKEN 에 업데이트\n2. 대시보드 OAuth 설정 → GOOGLE_REFRESH_TOKEN 에 입력"

          print("=" * 60)
          print("✅ Refresh Token 발급 성공!")
          print()
          print(f"{secret_name} 값: (로그에는 마스킹되어 안 보일 수 있음 — 아티팩트 파일 확인)")
          print()
          print("=" * 60)
          print("이 값을 복사해서:")
          print(save_hint)

          # refresh_token은 시크릿이 아니라 로그에 마스킹되지 않지만,
          # 혹시 모를 노출 최소화를 위해 아티팩트로도 저장 (1일 후 자동 삭제)
          with open("oauth_result.txt", "w") as f:
              f.write(f"{secret_name}={refresh_token}\n")
          PYEOF

      - name: Refresh Token 아티팩트 업로드
        if: ${{ env.step_mode == '2_exchange_code' }}
        uses: actions/upload-artifact@v4
        with:
          name: oauth-refresh-token
          path: oauth_result.txt
          retention-days: 1
