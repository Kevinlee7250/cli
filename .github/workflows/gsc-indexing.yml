name: 🔍 구글 색인 점검 (사이트맵 제출 + 색인 상태)

on:
  # 매일 오전 9시 KST (UTC 00:00)
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [latest]
    paths: ['.github/gsc-indexing-trigger']
  workflow_dispatch:
    inputs:
      inspect_count:
        description: '색인 검사할 글 수 (기본 45 = 블로그당 약 15건)'
        required: false
        default: '45'

permissions:
  contents: write

concurrency:
  group: gsc-indexing
  cancel-in-progress: false

jobs:
  gsc-indexing:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5
        with:
          ref: latest

      - name: Python 3.11 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          GSC_SITE_URL="${{ secrets.GSC_SITE_URL }}"
          LOG_LEVEL=info
          ENVEOF

      - name: 사이트맵 제출 + 색인 상태 검사
        working-directory: blog-automation
        run: |
          mkdir -p logs
          # 사이트맵이 왜 전달되지 않는지부터 확인 (읽기 전용이라 안전)
          python gsc_diagnose.py
          python gsc_indexing.py --submit
          # 45건 = 블로그 3개 × 약 15건. 블로그별로 몫을 나눠 뽑기 때문에
          # 발행이 적은 블로그(blog1)도 반드시 표본에 남습니다. 2026-10-19:
          # 20건이던 때는 발행량 많은 블로그가 창을 다 차지했습니다.
          python gsc_indexing.py --inspect "${{ inputs.inspect_count || '45' }}"
          # 색인 요청은 자동화할 수 없으므로(웹 UI 전용·하루 10건),
          # 무엇을 먼저 넣을지 우선순위만 뽑아 둡니다
          python index_priority.py
          # 내부 링크 구조 진단 (읽기 전용) — 들어오는 링크가 0개인 고아 페이지는
          # "Discovered - currently not indexed"의 대표적 원인입니다
          python internal_link_audit.py

      # 목차 페이지는 blog1 에서 '모든 글로 가는 유일한 길'입니다.
      # blog1 의 robots.txt 가 Disallow: /search 라, 홈의 "이전 글"
      # (= /search?updated-max=...) 을 구글이 따라가지 못합니다. 홈에서
      # 바로 닿는 건 최신 8편뿐이고 나머지는 목차를 거쳐야 합니다.
      #
      # 2026-11-19 확인: 목차가 10/08 이후 갱신되지 않아, 사이트맵 52편
      # 가운데 16편이 어디서도 링크되지 않는 고아였습니다. 구글이 와도
      # 보이지 않는 글입니다. 그래서 매일 다시 만듭니다.
      #
      # 왜 여기인가: 발행(blog-run)이 07:00 KST, 이 워크플로가 09:00 KST
      # 라서 그날 새 글이 두 시간 뒤 목차에 들어갑니다. 워크플로를 새로
      # 만들지 않은 이유는 실행 횟수 때문입니다 — 이 저장소는 포크라
      # 누적 실행이 많아지면 GitHub 가 Actions 를 꺼버립니다(2026-10월,
      # 11월에 각각 한 번씩 실제로 꺼졌습니다).
      #
      # continue-on-error: 목차 갱신이 실패해도 색인 리포트는 남아야
      # 합니다. 둘은 서로 독립입니다.
      - name: 글 목차 페이지 갱신 (blog1)
        working-directory: blog-automation
        continue-on-error: true
        run: python build_toc_page.py --blog blog1 --apply

      - name: 리포트 커밋 & 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in docs/data/index_status.json docs/data/gsc_diagnosis.json docs/data/index_priority.json docs/data/internal_links.json docs/data/sitemap_status.json; do [ -f "$f" ] && git add -f "$f"; done
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 건너뜀"
          else
            git commit -m "🔍 구글 색인 상태 리포트 (#${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase --autostash origin latest \
                && git push origin latest && break
              echo "push 재시도 $i/3..."
              sleep $((i * 2))
            done
          fi
