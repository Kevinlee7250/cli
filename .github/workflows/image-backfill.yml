name: 🖼️ 발행 글 이미지 소급 자체 호스팅

# 이미 발행된 글의 이미지를 저장소로 복제하고 본문을 그쪽으로 돌립니다.
#
# 반드시 두 번에 나눠 돌립니다.
#   1회차  mode: mirror    이미지를 내려받아 커밋 → Pages 배포를 기다림
#   2회차  mode: rewrite   공개 URL이 200을 주는 것만 본문 교체
#
# 순서를 바꾸거나 배포를 기다리지 않아도 글이 깨지지는 않습니다 — rewrite가
# URL 하나하나를 실제로 확인하고 아직 안 열린 것은 건너뜁니다. 다만 그만큼
# 건너뛴 이미지가 남으니, 배포를 확인하고 도는 편이 한 번에 끝납니다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '단계 (mirror=복제만, rewrite=본문 교체)'
        required: true
        default: 'mirror'
        type: choice
        options: [mirror, rewrite]
      dry_run:
        description: '대상만 확인 (변경 없음)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      blog:
        description: '특정 블로그만 (빈칸=전체)'
        required: false
        default: ''
      limit:
        description: '처리할 글 수 상한 (0=전체). 나눠 도는 것을 권장'
        required: false
        default: '50'

permissions:
  contents: write

concurrency:
  group: image-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: 소급 처리
        working-directory: blog-automation
        env:
          BLOGS_CONFIG: ${{ secrets.BLOGS_CONFIG }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          FLAG="--mirror-only"
          [ "${{ inputs.mode }}" = "rewrite" ] && FLAG="--rewrite"
          ARGS="$FLAG --limit ${{ inputs.limit || '50' }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "${{ inputs.blog }}" ] && ARGS="$ARGS --blog ${{ inputs.blog }}"
          echo "실행: python mirror_existing_images.py $ARGS"
          python mirror_existing_images.py $ARGS

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # docs/.gitignore(npm/cli 템플릿)가 docs/*를 무시하므로 -f 필수
          for f in docs/data/image_backfill.json docs/data/image_mirror.json; do [ -f "$f" ] && git add -f "$f"; done
          # 자체 호스팅 이미지 — 파일과 매니페스트가 함께 커밋돼야 본문 src가 살아 있습니다
          git add -f docs/images/ 2>/dev/null || true
          git add -f blog-automation/logs/used_images.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "🖼️ 발행 글 이미지 소급 (${{ inputs.mode }}, #${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase --autostash origin claude/blog-automation-system-KAbtE \
                && git push origin claude/blog-automation-system-KAbtE && break
              sleep $((i * 5))
            done
          fi

      - name: 다음에 할 일 안내
        if: success() && inputs.dry_run == 'false'
        run: |
          if [ "${{ inputs.mode }}" = "mirror" ]; then
            echo "::notice::복제 완료. Pages 배포가 끝난 뒤 mode=rewrite 로 다시 실행하세요."
          else
            echo "::notice::본문 교체 완료. 건너뛴 이미지가 있으면 배포 후 다시 실행하면 처리됩니다."
          fi
