name: 🔗 역방향 내부 링크 (고아 페이지 해소)

on:
  # 매일 오전 8시 KST (UTC 23:00).
  #
  # 주 1회 10건이던 것을 매일로 올립니다. 2026-08-24 기준 고아가 172건인데
  # 주간 배치로는 밀린 물량을 따라잡을 수 없습니다 — 발행 때마다 새 고아가
  # 하나씩 생기므로 순감소가 주당 몇 건에 그쳤습니다(8/21 165건 → 8/24 172건,
  # 오히려 늘었습니다). 밀린 것을 다 걷어내면 발행 직후 단계(blog-run)가
  # 새 고아를 그때그때 처리하므로 이 배치는 보조로 남습니다.
  schedule:
    - cron: '0 23 * * *'

  workflow_dispatch:
    inputs:
      apply:
        description: '실제 반영 (끄면 대상만 확인 — 글을 수정하지 않음)'
        type: boolean
        required: false
        default: false
      limit:
        description: '이번 실행에서 처리할 고아 글 수'
        required: false
        default: '25'
      blog_id:
        description: '특정 블로그만 (blog1/blog2/blog3, 비우면 전체)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: inbound-links
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          LOG_LEVEL=info
          ENVEOF

      - name: 고아 페이지 현황 갱신
        working-directory: blog-automation
        run: |
          # 링크를 만들기 전에 최신 고아 목록이 필요합니다 (읽기 전용)
          python internal_link_audit.py

      - name: 역방향 링크 생성
        working-directory: blog-automation
        run: |
          # 스케줄 실행에는 inputs가 없어 이 기본값이 실제로 쓰입니다.
          # 위 입력란의 default는 수동 실행에만 적용되므로 둘을 맞춰 둡니다.
          ARGS="--limit ${{ inputs.limit || '25' }}"
          if [ -n "${{ inputs.blog_id }}" ]; then
            ARGS="$ARGS --blog ${{ inputs.blog_id }}"
          fi
          # 스케줄 실행은 반영, 수동 실행은 명시적으로 켤 때만 반영합니다.
          # 발행된 글을 수정하는 작업이므로 기본값을 미리보기로 둡니다.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            ARGS="$ARGS --apply"
          else
            echo "=== 미리보기 모드 (글을 수정하지 않음) ==="
          fi
          echo "실행 인자: $ARGS"
          python inbound_linker.py $ARGS

      - name: 리포트 커밋 & 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # docs/.gitignore(npm/cli 템플릿)가 docs/* 를 무시하므로 -f 필요
          git add -f docs/data/inbound_links.json docs/data/internal_links.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "🔗 역방향 내부 링크 (#${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase --autostash origin claude/blog-automation-system-KAbtE \
                && git push origin claude/blog-automation-system-KAbtE && break
              sleep $((i * 3))
            done
          fi
