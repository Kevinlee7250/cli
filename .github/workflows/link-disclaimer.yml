name: 🔗 면책 조항 링크 넣기

# 면책 조항 페이지로 가는 링크를 다른 필수 페이지(개인정보처리방침·소개·문의)
# 하단에 넣습니다.
#
# 면책 조항 페이지는 API로 만들 수 있지만, 상단 메뉴 가젯에 올리는 것은
# 사람이 레이아웃에서 직접 체크해야 합니다. 그 전까지 이 페이지는 주소를
# 아는 사람만 볼 수 있습니다. 심사 쪽에서 중요한 것은 '메뉴에 있다'가
# 아니라 '돌아다니다 닿을 수 있다'이므로, 이미 메뉴에 있는 페이지에서
# 이어 둡니다.
#
# 메뉴에 올린 뒤에도 이 링크는 그대로 둬도 됩니다 — 푸터 상호링크는
# 흔한 형태입니다.

on:
  workflow_dispatch:
    inputs:
      blog_id:
        description: "블로그 ID (blog1/blog2/blog3/all)"
        required: false
        default: 'all'
      apply:
        description: '실제로 반영합니다 (false면 확인만)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: link-disclaimer

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5
        with:
          ref: latest

      - name: Python 3.11 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env <<ENVEOF
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          ENVEOF

      - name: 링크 넣기
        working-directory: blog-automation
        env:
          PYTHONIOENCODING: utf-8
        run: |
          ARGS=""
          if [ "${{ inputs.apply }}" = "true" ]; then
            ARGS="--apply"
            echo "=== 실제 반영 모드 ==="
          else
            echo "=== 확인 전용 모드 (변경 없음) ==="
          fi
          python link_disclaimer.py --blog "${{ inputs.blog_id }}" $ARGS

      - name: 필수 페이지 재확인 (읽기 전용)
        if: always()
        working-directory: blog-automation
        run: python required_pages_check.py || echo "⚠️ 필수 페이지 확인 실패"
