name: 수동 포스트 게시

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: '게시할 포스트 ID (pending_posts.json 내 id 값)'
        required: false
        default: ''
      post_ids:
        description: '여러 포스트 ID (쉼표 구분)'
        required: false
        default: ''
      publish_all:
        description: '모든 pending 포스트 일괄 게시'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5
        with:
          ref: latest

      - name: Python 3.11 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          ADSENSE_CLIENT_ID="${{ secrets.ADSENSE_CLIENT_ID }}"
          ADSENSE_SLOT_IDS="${{ secrets.ADSENSE_SLOT_IDS }}"
          POST_STATUS="live"
          LOG_LEVEL=info
          ENVEOF

      # 발행한 글을 post_registry에 등록하려면 현재 레지스트리부터 있어야
      # 합니다. 커밋돼 있는 쪽은 docs/data이고 post_manager가 읽는 쪽은
      # logs이므로, 먼저 맞춰 둡니다 (post-action.yml과 같은 방식).
      - name: 포스트 레지스트리 동기화
        working-directory: blog-automation
        run: |
          if [ -f ../docs/data/post_registry.json ]; then
            mkdir -p logs
            cp ../docs/data/post_registry.json logs/post_registry.json
            echo "레지스트리 동기화 완료"
          else
            echo "경고: docs/data/post_registry.json 없음 — 빈 레지스트리로 시작"
          fi

      - name: 포스트 게시
        working-directory: blog-automation
        run: |
          POST_ID="${{ inputs.post_id }}"
          POST_IDS="${{ inputs.post_ids }}"
          PUBLISH_ALL="${{ inputs.publish_all }}"

          if [ -z "$POST_ID" ] && [ -z "$POST_IDS" ] && [ "$PUBLISH_ALL" != "true" ]; then
            echo "❌ 게시할 포스트가 지정되지 않았습니다 (post_id, post_ids, 또는 publish_all=true 필요)"
            exit 1
          fi

          if [ "$PUBLISH_ALL" = "true" ]; then
            python publish_pending.py --all-pending
          elif [ -n "$POST_IDS" ] && [ -n "$POST_ID" ]; then
            python publish_pending.py --id "$POST_ID" --ids "$POST_IDS"
          elif [ -n "$POST_IDS" ]; then
            python publish_pending.py --ids "$POST_IDS"
          else
            python publish_pending.py --id "$POST_ID"
          fi

      - name: pending_posts.json 업데이트 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in docs/data/pending_posts.json docs/data/pending_bodies.json docs/data/pending_archive.json \
                   docs/data/post_registry.json blog-automation/logs/post_registry.json; do [ -f "$f" ] && git add -f "$f"; done
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 건너뜀"
          else
            git commit -m "✅ 수동 게시 완료 (#${{ github.run_number }})"
            _push_ok=0
            for i in 1 2 3; do
              git pull --rebase --autostash origin latest \
                && git push origin latest \
                && { _push_ok=1; break; }
              echo "pull+push 재시도 $i/3..."
              sleep $((i * 3))
            done
            [ "$_push_ok" = "1" ] || { echo "push 3회 실패 — 종료"; exit 1; }
          fi

      - name: 로그 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publish-logs-${{ github.run_number }}
          path: blog-automation/logs/
          retention-days: 7
