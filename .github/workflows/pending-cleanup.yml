name: 🧹 검토 대기 글 정리·재검증

on:
  # 매주 목요일 오전 6시 KST (UTC 수요일 21:00) — 다른 주간 작업과 분산
  schedule:
    - cron: '0 21 * * 3'

  workflow_dispatch:
    inputs:
      apply:
        description: '실제 반영 (끄면 리포트만 생성)'
        type: boolean
        required: false
        default: false
      expire_days:
        description: '이 일수 이상 방치된 대기 글을 만료 처리'
        required: false
        default: '30'
      revalidate_limit:
        description: '재검증할 최대 건수 (0=전체, AI 호출 비용 제어)'
        required: false
        default: '30'

permissions:
  contents: write

concurrency:
  group: pending-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          ADSENSE_CLIENT_ID="${{ secrets.ADSENSE_CLIENT_ID }}"
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          LOG_LEVEL=info
          ENVEOF

      - name: 대기 글 정리·재검증
        working-directory: blog-automation
        run: |
          mkdir -p logs
          ARGS="--expire-days ${{ inputs.expire_days || '30' }} --revalidate-limit ${{ inputs.revalidate_limit || '30' }}"
          # 스케줄 실행은 항상 반영 (쌓이는 것을 막는 게 목적)
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            ARGS="$ARGS --apply"
          else
            echo "=== 리포트 전용 모드 (파일 변경 없음) ==="
          fi
          echo "실행 인자: $ARGS"
          python pending_manager.py $ARGS

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/data/pending_posts.json docs/data/pending_report.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "🧹 검토 대기 글 정리 (#${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase --autostash origin claude/blog-automation-system-KAbtE \
                && git push origin claude/blog-automation-system-KAbtE && break
              sleep $((i * 3))
            done
          fi
