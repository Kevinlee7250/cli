name: 📋 포스트 단건 관리 (발행·보관·삭제·복원)

on:
  workflow_dispatch:
    inputs:
      action:
        description: '실행할 액션'
        required: true
        type: choice
        options:
          - publish   # 미발행 포스트를 Blogger에 즉시 게시
          - archive   # 포스트 보관 (status → skipped)
          - delete    # 포스트 삭제 (registry에서 제거)
          - restore   # 보관 포스트 복원 (status → pending)
      post_id:
        description: '포스트 ID (post_registry의 post_id 값)'
        required: true
        default: ''

permissions:
  contents: write

concurrency:
  group: post-action-${{ inputs.post_id }}
  cancel-in-progress: false

jobs:
  manage-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          ADSENSE_CLIENT_ID="${{ secrets.ADSENSE_CLIENT_ID }}"
          ADSENSE_SLOT_IDS="${{ secrets.ADSENSE_SLOT_IDS }}"
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          BLOG_NAME="${{ secrets.BLOG_NAME }}"
          POST_STATUS=live
          LOG_LEVEL=info
          ENVEOF

      - name: 로그 디렉토리 생성
        working-directory: blog-automation
        run: mkdir -p logs

      - name: 포스트 레지스트리 동기화
        working-directory: blog-automation
        run: |
          # docs/data/post_registry.json → logs/post_registry.json 복사 (최신 상태 반영)
          if [ -f ../docs/data/post_registry.json ]; then
            mkdir -p logs
            cp ../docs/data/post_registry.json logs/post_registry.json
            echo "레지스트리 동기화 완료 ($(wc -l < logs/post_registry.json | tr -d ' ') lines)"
          else
            echo "경고: docs/data/post_registry.json 없음 — 빈 레지스트리로 시작"
          fi

      - name: 포스트 액션 실행
        working-directory: blog-automation
        run: |
          ACTION="${{ inputs.action }}"
          POST_ID="${{ inputs.post_id }}"
          echo "=== 액션: $ACTION | 포스트: $POST_ID ==="
          python manage_post.py --action "$ACTION" --post-id "$POST_ID"

      - name: 변경사항 커밋 및 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 변경 가능한 파일 스테이징
          git add -f docs/data/post_registry.json 2>/dev/null || true
          git add -f blog-automation/logs/post_registry.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 건너뜀"
          else
            ACTION="${{ inputs.action }}"
            POST_ID="${{ inputs.post_id }}"
            EMOJI_MAP='{"publish":"✅","archive":"📦","delete":"🗑","restore":"🔄"}'
            EMOJI=$(python3 -c "import json,sys; m=json.loads('$EMOJI_MAP'); print(m.get('$ACTION','📋'))" 2>/dev/null || echo "📋")
            git commit -m "$EMOJI 포스트 $ACTION: ${POST_ID:0:40} (#${{ github.run_number }})"
            _push_ok=0
            for i in 1 2 3; do
              git pull --rebase --autostash origin claude/blog-automation-system-KAbtE \
                && git push origin claude/blog-automation-system-KAbtE \
                && { _push_ok=1; break; }
              echo "pull+push 재시도 $i/3..."
              sleep $((i * 3))
            done
            [ "$_push_ok" = "1" ] || { echo "push 3회 실패"; exit 1; }
          fi

      - name: 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-action-logs-${{ github.run_number }}
          path: blog-automation/logs/
          retention-days: 7
