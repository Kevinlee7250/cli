name: 🎨 포스트 디자인 원복

on:
  workflow_dispatch:
    inputs:
      blog_url:
        description: '디자인을 원복할 Blogger 포스트 URL'
        required: true
        default: ''
  push:
    branches:
      - claude/blog-automation-system-KAbtE
    paths:
      - '.github/restyle-trigger.txt'

permissions:
  contents: write

jobs:
  restyle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: 대상 URL 결정
        id: url
        run: |
          if [ -n "${{ inputs.blog_url }}" ]; then
            echo "target=${{ inputs.blog_url }}" >> $GITHUB_OUTPUT
          else
            echo "target=$(cat .github/restyle-trigger.txt | tr -d '[:space:]')" >> $GITHUB_OUTPUT
          fi

      - name: 🎨 디자인 원복 실행
        working-directory: blog-automation
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGS_CONFIG: ${{ secrets.BLOGS_CONFIG }}
        run: |
          TARGET="${{ steps.url.outputs.target }}"
          echo "=== 대상 URL: $TARGET ==="
          python restyle_post.py --blog-url "$TARGET"

      - name: 트리거 파일 삭제 (push 트리거 시)
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f .github/restyle-trigger.txt 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "🧹 restyle-trigger.txt 정리"
            git push origin claude/blog-automation-system-KAbtE
          fi
