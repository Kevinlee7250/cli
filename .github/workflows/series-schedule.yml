name: 📅 시리즈 발행 예약 처리

on:
  # 매일 오전 8시 KST (UTC 23:00 전날) — 전날 밤 방영분 리뷰를 익일 아침 작성
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: series-schedule
  cancel-in-progress: false

jobs:
  process-scheduled:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: latest

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          OPENAI_MODEL="${{ secrets.OPENAI_MODEL || 'gpt-4o' }}"
          AI_PROVIDER="${{ secrets.AI_PROVIDER || 'claude' }}"
          NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}"
          NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}"
          PIXABAY_API_KEY="${{ secrets.PIXABAY_API_KEY }}"
          IMGBB_API_KEY="${{ secrets.IMGBB_API_KEY }}"
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          ADSENSE_CLIENT_ID="${{ secrets.ADSENSE_CLIENT_ID }}"
          ADSENSE_SLOT_IDS="${{ secrets.ADSENSE_SLOT_IDS }}"
          ADSENSE_MODE=auto
          ADSENSE_MIN_SCORE=80
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          BLOG_NAME="${{ secrets.BLOG_NAME }}"
          POST_STATUS=live
          BLOG_LANGUAGE=ko
          TREND_COUNTRY=KR
          LOG_LEVEL=info
          LOG_FILE=./logs/automation.log
          ENVEOF

      - name: 발행 예약 처리
        working-directory: blog-automation
        run: |
          mkdir -p logs
          python main.py --process-scheduled-series

      - name: 데이터 커밋 & 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in \
            docs/data/posts.json docs/data/post_details.json docs/data/feature_flags.json docs/data/runs.json docs/data/meta.json \
            docs/data/series.json docs/data/pending_posts.json docs/data/pending_bodies.json docs/data/pending_archive.json \
            docs/data/post_registry.json docs/data/ai_usage.json \
            blog-automation/logs/series.json blog-automation/logs/run_history.json \
            blog-automation/logs/post_registry.json blog-automation/logs/used_images.json docs/data/image_mirror.json \
            blog-automation/logs/ai_usage.json blog-automation/logs/automation.log; do
            [ -f "$f" ] && git add -f "$f"
          done
          # 자체 호스팅 이미지 — 파일과 매니페스트가 함께 커밋돼야 본문 src가 살아 있습니다
          git add -f docs/images/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 건너뜀"
          else
            git commit -m "📅 시리즈 발행 예약 처리 (#${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase --autostash origin latest \
                && git push origin latest && break
              echo "push 재시도 $i/3..."
              sleep $((i * 2))
            done
          fi
