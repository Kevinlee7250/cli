name: ✍️ 블로그별 주제 글 작성 (일회성)

on:
  push:
    branches: [claude/blog-automation-system-KAbtE]
    paths: ['.github/topic-posts-trigger']

permissions:
  contents: write

concurrency:
  group: blog-run
  cancel-in-progress: false

jobs:
  write-topic-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          OPENAI_MODEL="${{ secrets.OPENAI_MODEL || 'gpt-4o' }}"
          AI_PROVIDER="${{ secrets.AI_PROVIDER || 'claude' }}"
          NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}"
          PIXABAY_API_KEY="${{ secrets.PIXABAY_API_KEY }}"
          NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}"
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          ADSENSE_CLIENT_ID="${{ secrets.ADSENSE_CLIENT_ID }}"
          ADSENSE_SLOT_IDS="${{ secrets.ADSENSE_SLOT_IDS }}"
          ADSENSE_MODE=auto
          ADSENSE_MIN_SCORE=80
          IMGBB_API_KEY="${{ secrets.IMGBB_API_KEY }}"
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          BLOG_NAME="${{ secrets.BLOG_NAME }}"
          POSTS_PER_RUN=1
          POST_STATUS=live
          BLOG_LANGUAGE=ko
          TREND_COUNTRY=KR
          LOG_LEVEL=info
          LOG_FILE=./logs/automation.log
          ENVEOF

      - name: 로그 디렉토리 생성
        working-directory: blog-automation
        run: mkdir -p logs

      - name: 블로그별 주제 글 작성
        working-directory: blog-automation
        run: |
          echo "=== blog1 (국내·해외여행·드라마·영화·연예·K-POP) ==="
          python main.py --once --blog blog1 --keyword "2026 하반기 방영 예정 드라마 기대작 정리"
          echo "=== blog2 (여행·스포츠·연예·드라마·영화) ==="
          python main.py --once --blog blog2 --keyword "2026 프로야구 순위 경쟁과 후반기 관전 포인트"
          echo "=== blog3 (금융·주식·ETF·경제·부동산) ==="
          python main.py --once --blog blog3 --keyword "2026 하반기 기준금리 전망과 예금 대출 전략"

      - name: 구글 색인 요청
        working-directory: blog-automation
        run: python gsc_indexing.py --submit || true

      - name: 대시보드 데이터 커밋 & 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in \
            docs/data/posts.json docs/data/post_details.json docs/data/feature_flags.json docs/data/posts_archive.json docs/data/runs.json \
            docs/data/analytics.json docs/data/meta.json docs/data/pending_posts.json docs/data/pending_bodies.json docs/data/pending_archive.json \
            docs/data/series.json docs/data/blogs.json docs/data/post_registry.json \
            docs/data/ai_usage.json \
            blog-automation/logs/run_history.json blog-automation/logs/used_keywords.json \
            blog-automation/logs/used_keywords_blog1.json blog-automation/logs/used_keywords_blog2.json \
            blog-automation/logs/used_keywords_blog3.json \
            blog-automation/logs/used_images.json blog-automation/logs/ai_usage.json \
            blog-automation/logs/post_registry.json blog-automation/logs/automation.log; do
            [ -f "$f" ] && git add -f "$f"
          done
          if git diff --staged --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "✍️ 블로그별 주제 글 작성 (#${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase --autostash origin claude/blog-automation-system-KAbtE \
                && git push origin claude/blog-automation-system-KAbtE && break
              sleep $((i * 3))
            done
          fi
