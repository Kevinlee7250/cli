name: 🔥 트렌드 선점 발행 감지

on:
  # 3시간마다 — 하루 3회 정규 실행(07/12/19시 KST) 사이의 빈틈을 커버
  schedule:
    - cron: '30 */3 * * *'

  workflow_dispatch:
    inputs:
      min_score:
        description: '선점 후보 최소 점수 (기본 4)'
        required: false
        default: '4'

  push:
    branches: [latest]
    paths: ['.github/trend-preempt-trigger']

concurrency:
  group: trend-preempt
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5
        with:
          ref: latest

      - name: Python 3.11 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}"
          NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}"
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          ADSENSE_CLIENT_ID="${{ secrets.ADSENSE_CLIENT_ID }}"
          LOG_LEVEL=info
          ENVEOF

      - name: 트렌드 키워드 수집
        working-directory: blog-automation
        run: python trending_collector.py

      - name: 선점 후보 감지
        working-directory: blog-automation
        run: python trend_preempt.py --min-score "${{ inputs.min_score || '4' }}"

      - name: 결과 커밋 & 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in docs/data/trending_keywords.json docs/data/trend_preempt.json; do [ -f "$f" ] && git add -f "$f"; done
          if git diff --staged --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "🔥 트렌드 선점 후보 갱신 (#${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase --autostash origin latest \
                && git push origin latest && break
              sleep $((i * 3))
            done
          fi
