name: 📋 주간 운영 브리핑

on:
  # 매주 월요일 오전 9시 KST (UTC 일요일 24:00 = 월요일 00:00)
  schedule:
    - cron: '0 0 * * 1'

  workflow_dispatch: {}

  push:
    branches: [latest]
    paths: ['.github/weekly-brief-trigger']

concurrency:
  group: weekly-brief
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: latest

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: 주간 브리핑 생성
        working-directory: blog-automation
        run: python weekly_brief.py

      - name: 결과 커밋 & 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/data/weekly_brief.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "📋 주간 운영 브리핑 (#${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase --autostash origin latest \
                && git push origin latest && break
              sleep $((i * 3))
            done
          fi
