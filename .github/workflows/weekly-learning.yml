name: 주간 학습 및 시스템 점검

on:
  # 매주 일요일 23:00 KST = UTC 14:00
  schedule:
    - cron: '0 14 * * 0'

  # 수동 실행 (즉시 점검용)
  workflow_dispatch:
    inputs:
      force_analyze:
        description: 'AI 분석 강제 실행 (데이터 없어도 실행)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  weekly-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: claude/blog-automation-system-KAbtE

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blog-automation/requirements.txt

      - name: 의존성 설치
        working-directory: blog-automation
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        working-directory: blog-automation
        run: |
          cat > .env << 'ENVEOF'
          ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}"
          NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}"
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          BLOGGER_BLOG_ID="${{ secrets.BLOGGER_BLOG_ID }}"
          ADSENSE_CLIENT_ID="${{ secrets.ADSENSE_CLIENT_ID }}"
          ADSENSE_SLOT_IDS="${{ secrets.ADSENSE_SLOT_IDS }}"
          GSC_SITE_URL="${{ secrets.GSC_SITE_URL }}"
          BLOGS_CONFIG='${{ secrets.BLOGS_CONFIG }}'
          BLOG_NAME="${{ secrets.BLOG_NAME }}"
          BLOG_LANGUAGE=ko
          LOG_LEVEL=info
          ENVEOF

      - name: 로그 디렉토리 생성
        working-directory: blog-automation
        run: mkdir -p logs

      - name: 주간 학습 및 시스템 점검 실행
        working-directory: blog-automation
        run: |
          echo "=== 주간 시스템 점검 시작 ($(TZ='Asia/Seoul' date)) ==="
          python weekly_learning.py
          echo "=== 점검 완료 ==="

      - name: 학습 데이터 커밋 & 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f \
            docs/data/learning.json \
            blog-automation/logs/learning.json \
            blog-automation/logs/learned_keywords.json \
            blog-automation/logs/weekly_learning.log \
            2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 건너뜀"
          else
            WEEK=$(TZ='Asia/Seoul' date '+%Y년 %m월 %d일')
            git commit -m "🧠 주간 학습 완료 — ${WEEK} (#${{ github.run_number }})"
            _push_ok=0
            for i in 1 2 3; do
              git pull --rebase --autostash origin claude/blog-automation-system-KAbtE \
                && git push origin claude/blog-automation-system-KAbtE \
                && { _push_ok=1; break; }
              echo "pull+push 재시도 $i/3..."
              sleep $((i * 3))
            done
            [ "$_push_ok" = "1" ] || { echo "push 3회 실패 — 종료"; exit 1; }
          fi

      - name: 로그 업로드 (아티팩트)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-learning-${{ github.run_number }}
          path: |
            blog-automation/logs/weekly_learning.log
            blog-automation/logs/learning.json
          retention-days: 30
